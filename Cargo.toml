[package]
name = "koda"
version = "0.3.0-beta.1"
edition = "2021"
rust-version = "1.82"
description = "Lightweight terminal coding agent for local OpenAI-compatible LLMs"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
globset = "0.4"
ignore = "0.4"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "charset",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "process",
    "time",
    "fs",
    "io-util",
    # Closing the terminal window, `kill`, or ctrl+c in a headless run all
    # arrive as signals, and koda's children -- a debug adapter holding a
    # stopped program, a browse engine holding a headless Chrome -- outlive the
    # process unless something catches them. tokio already ships this, so it
    # costs a feature flag rather than a dependency.
    "signal",
] }
toml = "0.8"
unicode-width = "0.2"

# Document formats. On by default: "read this spreadsheet" is a thing people
# ask a coding agent, and being told to rebuild with a Cargo flag is not an
# answer. They cost 1.4 MB of a 8.7 MB binary, measured, which is a price worth
# paying for the formats working when asked. A packager who wants the smaller
# build still has `--no-default-features`.
calamine = { version = "0.26", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
quick-xml = { version = "0.36", optional = true }
pdf-extract = { version = "0.7", optional = true }
# The browse tool's engine ships as a self-contained native binary inside an npm
# tarball. koda unpacks it itself so installing koda installs the browser engine
# too -- no npm, no Node, no second install step for the user. gzip + tar to open
# the tarball, sha2 to check it against a pinned hash before anything is run.
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
# Syntax-aware extraction for the code graph and the search index: real
# definition ranges, methods with their owners, and no fake definitions from
# comments. Five grammars cover most of what koda is pointed at; everything
# else keeps the lexical extractor. Measured cost is in docs/spec-treesitter.md.
# Agent memory (src/memstore.rs): one SQLite file per project, with FTS5 for
# keyword recall. Bundled so there is no system library to find; see
# docs/research-agent-memory.md for why this rather than a memory framework.
rusqlite = { version = "0.40", features = ["bundled"] }
tree-sitter = { version = "0.27", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.25", optional = true }

# `setsid` for commands koda runs, so a program that opens the terminal
# directly (sudo, ssh and git asking for a password) cannot draw over the TUI.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["docs", "pdf", "treesitter"]
docs = ["dep:calamine", "dep:zip", "dep:quick-xml"]
pdf = ["dep:pdf-extract"]
treesitter = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-go",
]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
