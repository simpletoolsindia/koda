<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="koda live observability and debug workspace" />
  <meta name="theme-color" content="#090a0d" />
  <title>koda · observability</title>

  <!-- The UI remains build-free: Tailwind Play CDN + React UMD + Babel. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            canvas: 'var(--canvas)',
            sidebar: 'var(--sidebar)',
            surface: 'var(--surface)',
            raised: 'var(--raised)',
            overlay: 'var(--overlay)',
            line: 'var(--line)',
            'line-strong': 'var(--line-strong)',
            ink: 'var(--ink)',
            muted: 'var(--muted)',
            subtle: 'var(--subtle)',
            accent: 'var(--accent)',
            'accent-hover': 'var(--accent-hover)',
            'accent-soft': 'var(--accent-soft)',
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'],
            mono: ['SFMono-Regular', 'Cascadia Code', 'Roboto Mono', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
          boxShadow: {
            panel: '0 1px 2px rgba(0,0,0,.22), 0 14px 36px rgba(0,0,0,.12)',
            popover: '0 18px 60px rgba(0,0,0,.44)',
          },
        },
      },
    };
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --canvas: #090a0d;
      --sidebar: #0c0d11;
      --surface: #101116;
      --raised: #15171d;
      --overlay: #1a1c24;
      --line: #23262f;
      --line-strong: #343845;
      --ink: #f4f4f5;
      --muted: #a1a1aa;
      --subtle: #71717a;
      --accent: #818cf8;
      --accent-hover: #a5b4fc;
      --accent-soft: rgba(129, 140, 248, .12);
      --ok: #34d399;
      --warn: #fbbf24;
      --danger: #fb7185;
      --info: #60a5fa;
      --radius-sm: 7px;
      --radius: 10px;
      --radius-lg: 14px;
    }

    * { box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: var(--canvas);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      z-index: -1;
      inset: -240px auto auto 12%;
      width: 620px;
      height: 360px;
      border-radius: 999px;
      background: rgba(99, 102, 241, .055);
      filter: blur(90px);
      pointer-events: none;
    }
    ::selection { background: rgba(129,140,248,.28); color: #fff; }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #30333d; border: 2px solid transparent; background-clip: padding-box; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #464a57; border: 2px solid transparent; background-clip: padding-box; }

    button, input, select, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    select option { background: var(--raised); color: var(--ink); }

    .app-sidebar {
      background: color-mix(in srgb, var(--sidebar) 97%, transparent);
      border-color: var(--line);
    }
    .topbar {
      background: color-mix(in srgb, var(--canvas) 90%, transparent);
      border-color: var(--line);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .nav-item { color: var(--muted); border: 1px solid transparent; }
    .nav-item:hover { color: var(--ink); background: rgba(255,255,255,.035); }
    .nav-item[data-active="true"] {
      color: #e0e7ff;
      background: var(--accent-soft);
      border-color: rgba(129,140,248,.2);
      box-shadow: inset 2px 0 0 var(--accent);
    }
    .nav-key {
      color: var(--subtle);
      border: 1px solid var(--line);
      background: rgba(255,255,255,.025);
    }
    .surface {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: 0 1px 2px rgba(0,0,0,.18);
    }
    .control {
      min-height: 34px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      transition: color .14s ease, border-color .14s ease, background .14s ease;
    }
    .control:hover { color: var(--ink); background: var(--raised); border-color: var(--line-strong); }
    .primary-button {
      min-height: 36px;
      color: #fff;
      background: #6366f1;
      border: 1px solid #7779f5;
      border-radius: var(--radius-sm);
      box-shadow: 0 1px 2px rgba(0,0,0,.3);
      transition: background .14s ease, border-color .14s ease;
    }
    .primary-button:hover { background: #7376f3; border-color: #949cff; }
    .form-input {
      width: 100%;
      min-height: 38px;
      padding: .58rem .7rem;
      color: var(--ink);
      background: #0c0d11;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      font-size: .8125rem;
      transition: border-color .14s ease, box-shadow .14s ease, background .14s ease;
    }
    .form-input::placeholder { color: #5f626d; }
    .form-input:hover { border-color: var(--line-strong); }
    .form-input:focus {
      outline: none;
      background: #0e0f14;
      border-color: rgba(129,140,248,.72);
      box-shadow: 0 0 0 3px rgba(129,140,248,.12);
    }
    .empty-state {
      color: var(--muted);
      background: var(--surface);
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-lg);
    }
    .status-dot { box-shadow: 0 0 0 3px rgba(52,211,153,.10); }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    #boot-error { font-family: ui-monospace, monospace; }

    /* Keep interactions calm: current developer tools favor density and state
       clarity over cards that jump under the pointer. */
    .hover\:scale-105:hover, .active\:scale-95:active, .active\:scale-\[0\.98\]:active { transform: none !important; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }
    .animate-fade-in { animation: fadeIn .18s ease-out; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .animate-toast-in { animation: toastIn .2s ease-out; }

    @media (max-width: 767px) {
      .app-sidebar { box-shadow: 0 -12px 34px rgba(0,0,0,.34); }
      .nav-item[data-active="true"] { box-shadow: inset 0 2px 0 var(--accent); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
      .animate-ping, .animate-pulse { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#71717a;font-family:ui-monospace,monospace;font-size:13px">
      Loading koda workspace…
    </div>
  </div>

  <script>
    Babel.registerPreset('react-classic', {
      presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]],
    });
  </script>

  <script type="text/babel" data-presets="react-classic">
// LiveLogs.jsx — Live tailing log viewer with filters, search, and auto-scroll
function LiveLogs({ logs, version, connected }) {
  const [levelFilter, setLevelFilter] = React.useState({ debug: false, info: true, warn: true, error: true });
  const [areaFilter, setAreaFilter] = React.useState('all');
  const [search, setSearch] = React.useState('');
  const [detailLevel, setDetailLevel] = React.useState('simple'); // simple | medium | high
  const [autoScroll, setAutoScroll] = React.useState(true);
  const [expandedSeq, setExpandedSeq] = React.useState(null);
  const containerRef = React.useRef(null);
  const bottomRef = React.useRef(null);

  const areas = React.useMemo(() => {
    const s = new Set();
    logs.forEach(l => s.add(l.area));
    return ['all', ...Array.from(s).sort()];
  }, [logs]);

  const filtered = React.useMemo(() => {
    return logs.filter(entry => {
      if (!levelFilter[entry.level]) return false;
      if (areaFilter !== 'all' && entry.area !== areaFilter) return false;
      if (detailLevel === 'simple' && (entry.level === 'debug')) return false;
      if (detailLevel === 'medium' && entry.level === 'debug' && entry.area !== 'tool') return false;
      if (search && !entry.message.toLowerCase().includes(search.toLowerCase()) &&
          !(entry.fields || []).some(([k,v]) => `${k}${v}`.toLowerCase().includes(search.toLowerCase()))) return false;
      return true;
    });
  }, [logs, levelFilter, areaFilter, search, detailLevel]);

  // Cap DOM nodes — show last 500
  const MAX_VISIBLE = 500;
  const visible = filtered.length > MAX_VISIBLE ? filtered.slice(-MAX_VISIBLE) : filtered;
  const trimmed = filtered.length - visible.length;

  React.useEffect(() => {
    if (autoScroll && bottomRef.current) {
      bottomRef.current.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }
  }, [visible, autoScroll]);

  const handleScroll = () => {
    if (!containerRef.current) return;
    const { scrollTop, scrollHeight, clientHeight } = containerRef.current;
    const atBottom = scrollHeight - scrollTop - clientHeight < 60;
    if (!atBottom && autoScroll) setAutoScroll(false);
  };

  const levelColors = {
    debug: 'text-gray-500',
    info: 'text-indigo-400',
    warn: 'text-amber-400',
    error: 'text-red-400',
  };
  const levelBg = {
    debug: 'bg-gray-500/10 border-gray-600/30',
    info: 'bg-indigo-500/10 border-indigo-500/30',
    warn: 'bg-amber-500/10 border-amber-500/30',
    error: 'bg-red-500/10 border-red-500/30',
  };

  const formatTime = (at) => {
    const d = new Date(at * 1000);
    return d.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' }) +
      '.' + String(d.getMilliseconds()).padStart(3, '0');
  };

  return (
    <div className="flex flex-col h-full">
      {/* Filter bar */}
      <div className="flex flex-wrap items-center gap-2 px-4 py-3 border-b border-line bg-surface">
        {/* Level toggles */}
        <div className="flex gap-1" role="group" aria-label="Log level filters">
          {['debug','info','warn','error'].map(lv => (
            <button key={lv} onClick={() => setLevelFilter(f => ({...f, [lv]: !f[lv]}))}
              className={`px-2.5 py-1 rounded-md text-xs font-mono font-semibold uppercase tracking-wide transition-all duration-200 border ${
                levelFilter[lv] ? levelBg[lv] + ' ' + levelColors[lv] : 'bg-transparent border-white/5 text-gray-600'
              } hover:scale-105 active:scale-95`}
              aria-pressed={levelFilter[lv]} aria-label={`Filter ${lv} logs`}>
              {lv}
            </button>
          ))}
        </div>
        <div className="w-px h-5 bg-white/10 mx-1" />
        {/* Area select */}
        <select value={areaFilter} onChange={e => setAreaFilter(e.target.value)}
          className="control px-2.5 py-1 text-xs focus:outline-none"
          aria-label="Filter by area">
          {areas.map(a => <option key={a} value={a}>{a}</option>)}
        </select>
        {/* Detail level */}
        <select value={detailLevel} onChange={e => setDetailLevel(e.target.value)}
          className="control px-2.5 py-1 text-xs focus:outline-none"
          aria-label="Detail level">
          <option value="simple">Simple (info+)</option>
          <option value="medium">Medium (+tool)</option>
          <option value="high">High (all)</option>
        </select>
        {/* Search */}
        <div className="relative flex-1 min-w-[140px] max-w-xs">
          <svg className="absolute left-2 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
          <input type="text" value={search} onChange={e => setSearch(e.target.value)}
            placeholder="Search logs…" aria-label="Search logs"
            className="form-input !min-h-[32px] !py-1 w-full pl-7 pr-2 text-xs" />
        </div>
        {/* Auto-scroll toggle */}
        <button onClick={() => { setAutoScroll(!autoScroll); if (!autoScroll && bottomRef.current) bottomRef.current.scrollIntoView({ behavior: 'smooth' }); }}
          className={`flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-medium transition-all border ${
            autoScroll ? 'bg-indigo-500/15 border-indigo-500/30 text-indigo-400' : 'bg-white/5 border-white/10 text-gray-500'
          } hover:scale-105 active:scale-95`}
          aria-label={autoScroll ? 'Pause auto-scroll' : 'Resume auto-scroll'}>
          {autoScroll ? (
            <svg className="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z"/></svg>
          ) : (
            <svg className="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zm-1.5-4.5l5-3.5-5-3.5v7z"/></svg>
          )}
          {autoScroll ? 'Tailing' : 'Paused'}
        </button>
        <span className="text-[10px] text-gray-600 tabular-nums">{filtered.length} entries</span>
        {/* Export filtered logs as JSON */}
        <button onClick={() => {
            const data = filtered.map(e => ({ seq: e.seq, at: e.at, level: e.level, area: e.area, message: e.message, fields: e.fields || [] }));
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const stamp = new Date().toISOString().replace(/[:.]/g, '-');
            a.href = url; a.download = `koda-logs-${stamp}.json`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
          }}
          disabled={filtered.length === 0}
          className="flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-medium transition-all border bg-white/5 border-white/10 text-gray-400 hover:text-gray-200 hover:bg-white/10 disabled:opacity-40 disabled:cursor-not-allowed hover:scale-105 active:scale-95"
          aria-label="Export filtered logs as JSON" title="Download the filtered logs as JSON">
          <svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
          Export
        </button>
      </div>

      {/* Log entries */}
      <div ref={containerRef} onScroll={handleScroll}
        className="flex-1 overflow-y-auto overflow-x-hidden bg-canvas font-mono text-[12px] leading-5 scroll-smooth"
        role="log" aria-live="polite" aria-label="Live log output">
        {trimmed > 0 && (
          <div className="text-center text-gray-600 text-[10px] py-1 border-b border-white/5">
            … {trimmed} older entries hidden …
          </div>
        )}
        {visible.length === 0 && (
          <div className="h-full min-h-[320px] flex items-center justify-center p-8">
            <div className="empty-state max-w-sm w-full px-6 py-8 text-center">
              <div className="mx-auto mb-3 w-9 h-9 rounded-lg bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-300 font-mono text-sm">›_</div>
              <div className="text-sm font-medium text-zinc-200">No matching runtime events</div>
              <p className="mt-1.5 text-[12px] leading-5 text-subtle">Adjust the filters, or run a task in koda to start the live event stream.</p>
            </div>
          </div>
        )}
        {visible.map((entry, i) => (
          <div key={entry.seq}
            className={`group flex items-start gap-2 px-3 py-0.5 border-b border-white/[0.03] hover:bg-white/[0.03] transition-colors duration-150 animate-fade-in cursor-pointer ${
              entry.level === 'error' ? 'bg-red-500/[0.04]' : entry.level === 'warn' ? 'bg-amber-500/[0.02]' : ''
            }`}
            onClick={() => setExpandedSeq(expandedSeq === entry.seq ? null : entry.seq)}
            role="button" tabIndex={0} aria-expanded={expandedSeq === entry.seq}
            onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setExpandedSeq(expandedSeq === entry.seq ? null : entry.seq); } }}>
            <span className="text-gray-600 select-none shrink-0 w-[70px]">{formatTime(entry.at)}</span>
            <span className={`shrink-0 w-[42px] font-bold uppercase text-[10px] tracking-wider pt-[1px] ${levelColors[entry.level]}`}>{entry.level}</span>
            <span className="shrink-0 w-[60px] text-purple-400/70 text-[10px] pt-[1px]">{entry.area}</span>
            <span className="text-gray-300 break-all flex-1">
              {search ? highlightText(entry.message, search) : entry.message}
            </span>
            {entry.fields && entry.fields.length > 0 && expandedSeq !== entry.seq && (
              <span className="text-gray-600 text-[10px] shrink-0 opacity-0 group-hover:opacity-100 transition-opacity">
                +{entry.fields.length} fields
              </span>
            )}
          </div>
        ))}
        {visible.length > 0 && expandedSeq !== null && visible.some(e => e.seq === expandedSeq) && (() => {
          const entry = visible.find(e => e.seq === expandedSeq);
          if (!entry || !entry.fields || entry.fields.length === 0) return null;
          return (
            <div className="mx-3 mb-1 p-2 rounded-lg bg-white/[0.03] border border-white/5 text-[11px] animate-fade-in">
              {entry.fields.map(([k,v], i) => (
                <div key={i} className="flex gap-2">
                  <span className="text-purple-400 font-medium">{k}:</span>
                  <span className="text-gray-400 break-all">{v}</span>
                </div>
              ))}
            </div>
          );
        })()}
        <div ref={bottomRef} />
      </div>
    </div>
  );
}

function highlightText(text, query) {
  if (!query) return text;
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return text;
  return React.createElement(React.Fragment, null,
    text.slice(0, idx),
    React.createElement('mark', { className: 'bg-yellow-500/30 text-yellow-200 rounded px-0.5' }, text.slice(idx, idx + query.length)),
    text.slice(idx + query.length)
  );
}
// LlmDebug.jsx — LLM request/response debug viewer with SSE reconstruction
function parseSseResponse(raw) {
  // Reconstruct assistant text, reasoning, and tool calls from raw SSE data: lines
  let text = '';
  let reasoning = '';
  const toolCalls = {}; // index -> {id, name, args}
  let finishReason = null;
  let done = false; // saw the [DONE] sentinel → the turn is complete

  const lines = (raw || '').split(/\r?\n/);
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed.startsWith('data:')) continue;
    const payload = trimmed.slice(5).trim();
    if (!payload) continue;
    if (payload === '[DONE]') { done = true; continue; }
    let obj;
    try { obj = JSON.parse(payload); } catch { continue; }
    const choices = obj.choices || [];
    for (const ch of choices) {
      const delta = ch.delta || ch.message || {};
      if (delta.content) text += delta.content;
      if (delta.reasoning_content) reasoning += delta.reasoning_content;
      if (delta.reasoning) reasoning += delta.reasoning;
      if (ch.finish_reason) finishReason = ch.finish_reason;
      const tcs = delta.tool_calls || [];
      for (const tc of tcs) {
        const idx = tc.index != null ? tc.index : (tc.id || 0);
        if (!toolCalls[idx]) toolCalls[idx] = { id: tc.id || '', name: '', args: '' };
        if (tc.id) toolCalls[idx].id = tc.id;
        if (tc.function) {
          if (tc.function.name) toolCalls[idx].name += tc.function.name;
          if (tc.function.arguments) toolCalls[idx].args += tc.function.arguments;
        }
      }
    }
  }
  // "Processing" = we have a response log but it hasn't hit [DONE]/finish yet.
  const processing = (raw && raw.length > 0) ? !(done || finishReason) : false;
  return { text, reasoning, toolCalls: Object.values(toolCalls), finishReason, done, processing };
}

// Copy text to the clipboard, tolerating older browsers / http origins.
function copyToClipboard(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
  } catch (_) { /* fall through */ }
  return new Promise((resolve) => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    document.body.removeChild(ta); resolve();
  });
}

// A small copy button; shows a transient ✓ after a successful copy.
function CopyButton({ text, label = 'Copy', className = '' }) {
  const [copied, setCopied] = React.useState(false);
  if (text == null || text === '') return null;
  return (
    <button type="button"
      onClick={(e) => { e.stopPropagation(); copyToClipboard(String(text)).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1200); }); }}
      className={`inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-medium border transition-all ${copied ? 'bg-emerald-500/20 border-emerald-500/40 text-emerald-300' : 'bg-white/5 border-white/10 text-gray-400 hover:text-gray-200 hover:bg-white/10'} ${className}`}
      title="Copy to clipboard" aria-label={copied ? 'Copied' : label}>
      {copied ? (
        <><svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M5 13l4 4L19 7" /></svg>Copied</>
      ) : (
        <><svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2v-2m-6-12h6a2 2 0 012 2v6m-8-8V3m0 2h.01" /></svg>{label}</>
      )}

function parseRequest(raw) {
  try { return typeof raw === 'string' ? JSON.parse(raw) : raw; }

}

function LlmDebug({ debug, loading, error }) {
  const [selectedId, setSelectedId] = React.useState(null);
  const [followLatest, setFollowLatest] = React.useState(true);

  const sessions = (debug && debug.sessions) || [];

  // Which sessions are still streaming (prompt sent, response not yet [DONE]).
  const statusById = React.useMemo(() => {
    const m = {};

// Render one message's content: strings as text, and multimodal arrays with
// image_url parts shown as thumbnails, text/doc parts shown readably — instead
// of dumping raw JSON.
function MessageContent({ m }) {
  const c = m.content;
  if (typeof c === 'string') {
    return <pre className="p-2.5 text-[11px] text-gray-300 whitespace-pre-wrap break-words max-h-64 overflow-y-auto font-mono">{c || (m.tool_calls ? JSON.stringify(m.tool_calls, null, 2) : '(empty)')}</pre>;
  }
  if (Array.isArray(c)) {
    return (
      <div className="p-2.5 space-y-2">
        {c.map((part, i) => {
          const type = part.type || (part.image_url ? 'image_url' : part.text != null ? 'text' : 'unknown');
          if (type === 'image_url') {
            const url = (part.image_url && (part.image_url.url || part.image_url)) || part.url || '';
            return (
              <div key={i} className="flex items-start gap-2">
                <span className="text-[9px] uppercase tracking-wider text-indigo-400/70 pt-1 shrink-0">image</span>
                {url ? <img src={url} alt="attached image" className="max-h-40 rounded-lg border border-white/10 object-contain bg-black/30" />
                     : <span className="text-[11px] text-gray-500">(no url)</span>}
              </div>
            );
          }
          const text = part.text != null ? part.text : (typeof part === 'string' ? part : JSON.stringify(part, null, 2));
          return (
            <div key={i} className="flex items-start gap-2">
              <span className="text-[9px] uppercase tracking-wider text-gray-500 pt-1 shrink-0">{type}</span>
              <pre className="text-[11px] text-gray-300 whitespace-pre-wrap break-words max-h-64 overflow-y-auto font-mono flex-1">{text}</pre>
            </div>
          );
        })}
      </div>
    );
  }
  return <pre className="p-2.5 text-[11px] text-gray-300 whitespace-pre-wrap break-words max-h-64 overflow-y-auto font-mono">{JSON.stringify(c ?? m, null, 2)}</pre>;
}

function Panel({ title, accent = 'indigo', children, copy }) {
  const accentColors = {
    indigo: 'border-indigo-500/20', purple: 'border-purple-500/20', green: 'border-emerald-500/20',
  };
  const dotColors = { indigo: 'bg-indigo-400', purple: 'bg-purple-400', green: 'bg-emerald-400' };
  return (
    <section className={`rounded-xl bg-surface border ${accentColors[accent]} shadow-panel overflow-hidden`}>
      <h3 className="px-3 py-2 text-xs font-semibold text-gray-300 border-b border-white/5 flex items-center gap-2">
        <span className={`w-1.5 h-1.5 rounded-full ${dotColors[accent]}`} />{title}
        {copy != null && copy !== '' && <span className="ml-auto"><CopyButton text={copy} label="" /></span>}
      </h3>
      <div className="p-3">{children}</div>
    </section>
  );
}

function roleColor(role) {
  return { system: '#a78bfa', user: '#22d3ee', assistant: '#34d399', tool: '#fbbf24' }[role] || '#9ca3af';
}
// Flatten a message to plain text for the clipboard (images become a marker).
function msgPlainText(m) {
  if (typeof m.content === 'string') return m.content;
  if (Array.isArray(m.content)) {
    return m.content.map(c => {
      if (c.type === 'image_url' || c.image_url) return '[image]';
      return c.text != null ? c.text : (typeof c === 'string' ? c : JSON.stringify(c));
    }).join('\n');
  }
  if (m.tool_calls) return JSON.stringify(m.tool_calls, null, 2);
  return JSON.stringify(m.content ?? m, null, 2);
}
function prettyArgs(args) {
  try { return JSON.stringify(JSON.parse(args), null, 2); } catch { return args; }
}
// CodeGraph.jsx — Interactive force-directed graph of code symbols on Canvas
function CodeGraph({ graph, loading, error }) {
  const canvasRef = React.useRef(null);
  const stateRef = React.useRef({ nodes: [], edges: [], transform: { x: 0, y: 0, k: 1 } });
  const [hovered, setHovered] = React.useState(null);
  const [focused, setFocused] = React.useState(null);
  const [search, setSearch] = React.useState('');
  const rafRef = React.useRef(null);
  const dragRef = React.useRef(null);
  const reducedMotion = React.useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  const kindColors = {
    fn: '#818cf8', function: '#818cf8', method: '#a5b4fc',
    struct: '#a78bfa', class: '#f472b6', interface: '#c084fc',
    enum: '#fbbf24', trait: '#fb923c', type: '#facc15',
    const: '#34d399', var: '#4ade80', module: '#94a3b8',
  };
  const colorFor = (kind) => kindColors[kind] || '#9ca3af';

  // Build simulation nodes/edges from graph
  React.useEffect(() => {
    if (!graph) return;
    const canvas = canvasRef.current;
    const W = canvas ? canvas.clientWidth : 800;
    const H = canvas ? canvas.clientHeight : 600;

    const symNodes = graph.nodes.map((n, i) => ({
      id: n.id, kind: n.kind, file: n.file, line: n.line, refs: n.refs, type: 'symbol',
      x: W/2 + Math.cos(i) * (100 + Math.random()*200),
      y: H/2 + Math.sin(i) * (100 + Math.random()*200),
      vx: 0, vy: 0,
    }));

    // file nodes derived from edges
    const fileSet = new Map();
    graph.edges.forEach(e => { if (!fileSet.has(e.from)) fileSet.set(e.from, true); });
    const fileNodes = Array.from(fileSet.keys()).map((f, i) => ({
      id: f, kind: 'file', type: 'file', file: f,
      x: W/2 + Math.cos(i*2) * (150 + Math.random()*150),
      y: H/2 + Math.sin(i*2) * (150 + Math.random()*150),
      vx: 0, vy: 0,
    }));

    const nodeMap = new Map();
    [...symNodes, ...fileNodes].forEach(n => nodeMap.set(n.type + ':' + n.id, n));

    const simEdges = graph.edges.map(e => ({
      source: nodeMap.get('file:' + e.from),
      target: nodeMap.get('symbol:' + e.to),
      kind: e.kind,
    })).filter(e => e.source && e.target);

    stateRef.current.nodes = [...symNodes, ...fileNodes];
    stateRef.current.edges = simEdges;
    stateRef.current.transform = { x: 0, y: 0, k: 1 };
    setFocused(null);
    startSim();
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [graph]);

  const startSim = () => {
    let ticks = 0;
    const maxTicks = reducedMotion.current ? 1 : 300;
    const tick = () => {
      const { nodes, edges } = stateRef.current;
      const canvas = canvasRef.current;
      if (!canvas) return;
      const W = canvas.clientWidth, H = canvas.clientHeight;
      const cx = W/2, cy = H/2;

      // repulsion
      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        for (let j = i+1; j < nodes.length; j++) {
          const b = nodes[j];
          let dx = a.x - b.x, dy = a.y - b.y;
          let dist2 = dx*dx + dy*dy + 0.01;
          const force = 1400 / dist2;
          const dist = Math.sqrt(dist2);
          const fx = (dx/dist) * force, fy = (dy/dist) * force;
          a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
        }
      }
      // springs
      for (const e of edges) {
        const dx = e.target.x - e.source.x, dy = e.target.y - e.source.y;
        const dist = Math.sqrt(dx*dx + dy*dy) + 0.01;
        const target = 60;
        const force = (dist - target) * 0.02;
        const fx = (dx/dist)*force, fy = (dy/dist)*force;
        e.source.vx += fx; e.source.vy += fy;
        e.target.vx -= fx; e.target.vy -= fy;
      }
      // centering + integrate
      for (const n of nodes) {
        n.vx += (cx - n.x) * 0.002;
        n.vy += (cy - n.y) * 0.002;
        n.vx *= 0.85; n.vy *= 0.85;
        if (dragRef.current !== n) { n.x += n.vx; n.y += n.vy; }
      }
      draw();
      ticks++;
      if (ticks < maxTicks) rafRef.current = requestAnimationFrame(tick);
    };
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    tick();
  };

  const draw = () => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    if (canvas.width !== W*dpr) { canvas.width = W*dpr; canvas.height = H*dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const t = stateRef.current.transform;
    ctx.translate(t.x, t.y); ctx.scale(t.k, t.k);

    const { nodes, edges } = stateRef.current;
    const q = search.toLowerCase();
    const focusId = focused;

    // edges
    ctx.lineWidth = 0.7 / t.k;
    for (const e of edges) {
      const active = focusId && (e.source.id === focusId || e.target.id === focusId);
      ctx.strokeStyle = active ? 'rgba(129,140,248,0.55)' : 'rgba(148,163,184,0.12)';
      ctx.beginPath();
      ctx.moveTo(e.source.x, e.source.y);
      ctx.lineTo(e.target.x, e.target.y);
      ctx.stroke();
    }

    // nodes
    for (const n of nodes) {
      const isFile = n.type === 'file';
      const r = isFile ? 5 : Math.min(3 + (n.refs || 0) * 0.6, 11);
      const matched = q && n.id.toLowerCase().includes(q);
      const isFocus = focusId === n.id;
      const dim = focusId && !isFocus && !edges.some(e => (e.source.id === focusId && e.target === n) || (e.target.id === focusId && e.source === n));

      ctx.globalAlpha = dim ? 0.15 : 1;
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI*2);
      if (isFile) {
        ctx.fillStyle = '#1e293b';
        ctx.strokeStyle = 'rgba(148,163,184,0.4)';
        ctx.fill(); ctx.lineWidth = 1/t.k; ctx.stroke();
      } else {
        ctx.fillStyle = colorFor(n.kind);
        ctx.fill();
      }
      if (matched || isFocus) {
        ctx.strokeStyle = matched ? '#fde047' : '#fff';
        ctx.lineWidth = 2/t.k;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      // labels for larger/focused nodes
      if ((r > 7 || isFocus || matched || (hovered && hovered.id === n.id)) && t.k > 0.5) {
        ctx.fillStyle = 'rgba(226,232,240,0.85)';
        ctx.font = `${10/t.k}px ui-monospace, monospace`;
        const label = isFile ? n.id.split('/').pop() : n.id;
        ctx.fillText(label, n.x + r + 2, n.y + 3);
      }
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };

  React.useEffect(() => { draw(); }, [hovered, focused, search]);

  // Interaction: convert screen to graph coords
  const toGraph = (clientX, clientY) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const t = stateRef.current.transform;
    return { x: (clientX - rect.left - t.x) / t.k, y: (clientY - rect.top - t.y) / t.k };
  };
  const nodeAt = (gx, gy) => {
    const { nodes } = stateRef.current;
    for (let i = nodes.length - 1; i >= 0; i--) {
      const n = nodes[i];
      const r = (n.type === 'file' ? 5 : Math.min(3 + (n.refs||0)*0.6, 11)) + 4;
      if ((n.x-gx)**2 + (n.y-gy)**2 < r*r) return n;
    }
    return null;
  };

  const onMouseDown = (e) => {
    const g = toGraph(e.clientX, e.clientY);
    const n = nodeAt(g.x, g.y);
    if (n) { dragRef.current = n; }
    else { dragRef.current = { pan: true, sx: e.clientX, sy: e.clientY, ox: stateRef.current.transform.x, oy: stateRef.current.transform.y }; }
  };
  const onMouseMove = (e) => {
    const d = dragRef.current;
    if (d && d.pan) {
      stateRef.current.transform.x = d.ox + (e.clientX - d.sx);
      stateRef.current.transform.y = d.oy + (e.clientY - d.sy);
      draw();
      return;
    }
    if (d) {
      const g = toGraph(e.clientX, e.clientY);
      d.x = g.x; d.y = g.y; d.vx = 0; d.vy = 0;
      draw();
      return;
    }
    const g = toGraph(e.clientX, e.clientY);
    const n = nodeAt(g.x, g.y);
    setHovered(n && n.type === 'symbol' ? n : (n || null));
    canvasRef.current.style.cursor = n ? 'pointer' : 'grab';
  };
  const onMouseUp = (e) => {
    const d = dragRef.current;
    if (d && !d.pan && Math.abs(d.vx) < 0.01) {
      // treat as click-focus
    }
    if (d && !d.pan) {
      const g = toGraph(e.clientX, e.clientY);
      const n = nodeAt(g.x, g.y);
      if (n && n === d) setFocused(focused === n.id ? null : n.id);
    }
    dragRef.current = null;
  };
  const onWheel = (e) => {
    e.preventDefault();
    const t = stateRef.current.transform;
    const rect = canvasRef.current.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const scale = e.deltaY < 0 ? 1.1 : 0.9;
    const nk = Math.max(0.2, Math.min(4, t.k * scale));
    t.x = mx - (mx - t.x) * (nk / t.k);
    t.y = my - (my - t.y) * (nk / t.k);
    t.k = nk;
    draw();
  };

  if (loading && !graph) return <div className="flex items-center justify-center h-full text-gray-500">Building code graph…</div>;
  if (error && !graph) return (
    <div className="flex items-center justify-center h-full p-8">
      <div className="max-w-lg text-center text-sm text-amber-200 bg-amber-500/10 border border-amber-500/20 rounded-2xl p-6">{error}</div>
    </div>
  );

  const languages = (graph && graph.languages) || [];
  const usedKinds = graph ? Array.from(new Set(graph.nodes.map(n => n.kind))) : [];

  return (
    <div className="relative h-full bg-canvas">
      {/* Top controls */}
      <div className="absolute top-3 left-3 right-3 z-10 flex flex-wrap items-center gap-2 pointer-events-none">
        <div className="relative pointer-events-auto">
          <input type="text" value={search} onChange={e => setSearch(e.target.value)}
            placeholder="Highlight symbol…" aria-label="Search symbols to highlight"
            className="form-input !min-h-[36px] !w-60 bg-[#101116]/95 backdrop-blur px-3 py-1.5 text-xs" />
        </div>
        {graph && (
          <div className="pointer-events-auto px-2.5 py-1.5 rounded-lg bg-[#15171d]/95 backdrop-blur border border-line text-[11px] text-gray-400">
            {graph.files} files · {graph.nodes.length} symbols · {graph.edges.length} edges
          </div>
        )}
        {focused && (
          <button onClick={() => setFocused(null)} className="pointer-events-auto px-2.5 py-1.5 rounded-lg bg-indigo-500/20 border border-indigo-500/30 text-indigo-300 text-[11px] hover:bg-indigo-500/30">
            ✕ Clear focus
          </button>
        )}
      </div>

      {graph && graph.truncated && (
        <div className="absolute top-14 left-3 z-10 px-3 py-1.5 rounded-lg bg-amber-500/15 border border-amber-500/30 text-amber-300 text-[11px]">
          ⚠ Graph truncated — showing a subset of the codebase.
        </div>
      )}

      {/* Language legend */}
      {languages.length > 0 && (
        <div className="absolute bottom-3 left-3 z-10 p-2.5 rounded-lg bg-[#15171d]/95 backdrop-blur border border-line max-w-[200px]">
          <div className="text-[10px] uppercase tracking-wider text-gray-500 mb-1.5 font-semibold">Languages</div>
          <div className="space-y-0.5">
            {languages.map(([lang, count], i) => (
              <div key={i} className="flex justify-between gap-3 text-[11px]">
                <span className="text-gray-300">{lang}</span>
                <span className="text-gray-500 tabular-nums">{count}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Kind legend */}
      {usedKinds.length > 0 && (
        <div className="absolute bottom-3 right-3 z-10 p-2.5 rounded-lg bg-[#15171d]/95 backdrop-blur border border-line">
          <div className="text-[10px] uppercase tracking-wider text-gray-500 mb-1.5 font-semibold">Symbol kinds</div>
          <div className="flex flex-wrap gap-x-3 gap-y-1 max-w-[220px]">
            {usedKinds.map(k => (
              <span key={k} className="flex items-center gap-1.5 text-[11px] text-gray-300">
                <span className="w-2 h-2 rounded-full" style={{ background: colorFor(k) }} />{k}
              </span>
            ))}
            <span className="flex items-center gap-1.5 text-[11px] text-gray-300">
              <span className="w-2 h-2 rounded-sm border border-slate-400 bg-slate-700" />file
            </span>
          </div>
        </div>
      )}

      {/* Hover tooltip */}
      {hovered && hovered.type === 'symbol' && (
        <div className="absolute top-14 right-3 z-10 p-3 rounded-lg bg-[#1a1c24]/95 backdrop-blur border border-line-strong shadow-popover max-w-xs animate-fade-in">
          <div className="font-mono text-sm text-indigo-300 font-semibold break-all">{hovered.id}</div>
          <div className="text-[11px] text-gray-400 mt-1">
            <span className="px-1.5 py-0.5 rounded bg-white/10 mr-1" style={{ color: colorFor(hovered.kind) }}>{hovered.kind}</span>
            {hovered.refs != null && <span>· {hovered.refs} refs</span>}
          </div>
          {hovered.file && <div className="text-[10px] text-gray-500 mt-1 break-all">{hovered.file}{hovered.line ? ':' + hovered.line : ''}</div>}
        </div>
      )}

      <canvas ref={canvasRef}
        className="w-full h-full block"
        style={{ cursor: 'grab' }}
        onMouseDown={onMouseDown} onMouseMove={onMouseMove} onMouseUp={onMouseUp} onMouseLeave={() => { dragRef.current = null; setHovered(null); }}
        onWheel={onWheel}
        role="img" aria-label="Interactive code symbol graph" />

      {graph && graph.nodes.length === 0 && (
        <div className="absolute inset-0 flex items-center justify-center text-gray-600 text-sm">No symbols indexed yet.</div>
      )}
    </div>
  );
}
// AgentsSkills.jsx — Skills & role agents list + editor
function AgentsSkills({ skills, loading, error, onRefresh, pushToast }) {
  const [form, setForm] = React.useState({ name: '', when: '', role: '', body: '' });
  const [submitting, setSubmitting] = React.useState(false);
  const [filter, setFilter] = React.useState('all'); // all | skills | agents

  const loadIntoForm = (s) => {
    setForm({ name: s.name || '', when: s.when || '', role: s.role || '', body: s.body || '' });
    window.scrollTo && window.scrollTo(0, 0);
  };

  const resetForm = () => setForm({ name: '', when: '', role: '', body: '' });

  const remove = async (s, e) => {
    if (e) e.stopPropagation();
    if (!window.confirm(`Delete ${s.role ? 'agent' : 'skill'} "${s.name}"? This removes ${s.source || 'its file'}.`)) return;
    try {
      const res = await fetch('/api/skills/' + encodeURIComponent(s.name), { method: 'DELETE' });
      const data = await res.json();
      if (data.ok) {
        pushToast(`Deleted "${s.name}"`, 'success');
        if (form.name === s.name) resetForm();
        onRefresh();
      } else {
        pushToast(data.error || 'Delete failed', 'error');
      }
    } catch (err) {
      pushToast('Request failed: ' + err.message, 'error');
    }
  };

  const submit = async (e) => {
    e.preventDefault();
    if (!form.name.trim()) { pushToast('Name is required', 'error'); return; }
    setSubmitting(true);
    try {
      const payload = { name: form.name.trim(), when: form.when, body: form.body };
      if (form.role.trim()) payload.role = form.role.trim();
      const res = await fetch('/api/skills', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (data.ok) {
        pushToast(`Saved "${form.name}"${form.role ? ' (agent)' : ''}${data.path ? ' → ' + data.path : ''}`, 'success');
        resetForm();
        onRefresh();
      } else {
        pushToast(data.error || 'Save failed', 'error');
      }
    } catch (err) {
      pushToast('Request failed: ' + err.message, 'error');
    } finally {
      setSubmitting(false);
    }
  };

  const list = skills || [];
  const filtered = list.filter(s => filter === 'all' ? true : filter === 'agents' ? !!s.role : !s.role);
  const agentCount = list.filter(s => s.role).length;
  const skillCount = list.length - agentCount;

  return (
    <div className="flex flex-col lg:flex-row h-full overflow-hidden">
      {/* List */}
      <div className="flex-1 overflow-y-auto bg-canvas p-4 md:p-6">
        <div className="flex items-center gap-2 mb-3">
          <h2 className="text-sm font-semibold text-gray-200">Knowledge Base</h2>
          <div className="flex gap-1 ml-auto" role="group" aria-label="Filter">
            {[['all', `All ${list.length}`], ['skills', `Skills ${skillCount}`], ['agents', `Agents ${agentCount}`]].map(([v, label]) => (
              <button key={v} onClick={() => setFilter(v)}
                className={`px-2.5 py-1 rounded-lg text-xs font-medium transition-all ${
                  filter === v ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30' : 'bg-white/5 text-gray-400 border border-white/10 hover:bg-white/10'
                }`}>{label}</button>
            ))}
          </div>
        </div>

        {loading && list.length === 0 && <div className="text-gray-500 text-sm">Loading…</div>}
        {error && list.length === 0 && (
          <div className="text-sm text-amber-200 bg-amber-500/10 border border-amber-500/20 rounded-lg p-4">{error}</div>
        )}
        {!loading && !error && filtered.length === 0 && <div className="text-gray-500 text-sm p-4 rounded-lg bg-white/[0.02] border border-white/5">No entries. Create one on the right →</div>}

        <div className="grid gap-2 sm:grid-cols-2">
          {filtered.map((s, i) => (
            <div key={i}
              className="relative text-left p-4 rounded-xl bg-surface border border-line hover:border-line-strong hover:bg-raised transition-colors group animate-fade-in shadow-panel">
              <div className="flex items-center gap-2 mb-1">
                <button type="button" onClick={() => loadIntoForm(s)} className="flex items-center gap-2 min-w-0 flex-1 text-left" aria-label={`Edit ${s.name}`}>
                  <span className="font-mono text-sm text-gray-100 font-semibold truncate">{s.name}</span>
                  {s.role ? (
                    <span className="px-1.5 py-0.5 rounded bg-purple-500/20 text-purple-300 text-[10px] font-medium border border-purple-500/30 shrink-0">agent · {s.role}</span>
                  ) : (
                    <span className="px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 text-[10px] font-medium border border-emerald-500/30 shrink-0">skill</span>
                  )}
                </button>
                <div className="flex items-center gap-1 ml-auto opacity-100 transition-opacity">
                  <button type="button" onClick={() => loadIntoForm(s)} title="Edit" aria-label={`Edit ${s.name}`}
                    className="w-8 h-8 inline-flex items-center justify-center rounded-md text-gray-500 hover:text-indigo-300 hover:bg-white/10">
                    <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                  </button>
                  <button type="button" onClick={(e) => remove(s, e)} title="Delete" aria-label={`Delete ${s.name}`}
                    className="w-8 h-8 inline-flex items-center justify-center rounded-md text-gray-500 hover:text-red-400 hover:bg-red-500/10">
                    <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                  </button>
                </div>
              </div>
              <button type="button" onClick={() => loadIntoForm(s)} className="block w-full text-left" aria-label={`Edit ${s.name} details`}>
                {s.when && <div className="text-[11px] text-gray-500 mb-1"><span className="text-gray-600">when:</span> {s.when}</div>}
                {s.body && <div className="text-[11px] text-gray-400 line-clamp-2 leading-relaxed">{s.body.slice(0, 140)}{s.body.length > 140 ? '…' : ''}</div>}
                {s.source && <div className="text-[10px] text-gray-600 mt-1.5 truncate">📄 {s.source}</div>}
              </button>
            </div>
          ))}
        </div>
      </div>

      {/* Editor */}
      <aside className="lg:w-[420px] shrink-0 border-t lg:border-t-0 lg:border-l border-line overflow-y-auto bg-surface">
        <form onSubmit={submit} className="p-4 space-y-3">
          <div className="flex items-center gap-2">
            <h2 className="text-sm font-semibold text-gray-200">{form.role ? 'Edit / Create Agent' : 'Edit / Create Skill'}</h2>
            {(form.name || form.body) && (
              <button type="button" onClick={resetForm} className="ml-auto text-[11px] text-gray-500 hover:text-gray-300">Clear</button>
            )}
          </div>

          <Field label="Name" required>
            <input value={form.name} onChange={e => setForm({...form, name: e.target.value})}
              placeholder="e.g. rust-error-handling"
              className="form-input" aria-label="Name" required />
          </Field>

          <Field label="When to use">
            <input value={form.when} onChange={e => setForm({...form, when: e.target.value})}
              placeholder="e.g. writing Rust that returns Result"
              className="form-input" aria-label="When to use" />
          </Field>

          <Field label="Role (set to make this an Agent)">
            <input value={form.role} onChange={e => setForm({...form, role: e.target.value})}
              placeholder="e.g. senior-reviewer (optional)"
              className="form-input" aria-label="Role" />
            <p className="text-[10px] text-gray-600 mt-1">Setting a role turns this entry into a role agent.</p>
          </Field>

          <Field label="Body">
            <textarea value={form.body} onChange={e => setForm({...form, body: e.target.value})}
              placeholder="The knowledge / instructions…" rows={10}
              className="form-input font-mono text-[12px] resize-y" aria-label="Body" />
          </Field>

          <button type="submit" disabled={submitting}
            className="primary-button w-full py-2.5 text-sm font-semibold disabled:opacity-50 disabled:cursor-not-allowed">
            {submitting ? 'Saving…' : (form.role ? 'Save Agent' : 'Save Skill')}
          </button>
        </form>
      </aside>
    </div>
  );
}

function Field({ label, required, children }) {
  return (
    <label className="block">
      <span className="text-[11px] font-medium text-gray-400 mb-1 block">{label}{required && <span className="text-indigo-400"> *</span>}</span>
      {children}
    </label>
  );
}
// SystemPrompt.jsx — view and edit koda's system prompt from the web UI.
function SystemPrompt({ data, loading, error, onRefresh, pushToast }) {
  const [value, setValue] = React.useState('');
  const [seeded, setSeeded] = React.useState(false);
  const [saving, setSaving] = React.useState(false);

  // Seed the editor once data arrives: show the custom prompt if set, else the
  // built-in default so the user edits from something real rather than blank.
  React.useEffect(() => {
    if (data && !seeded) {
      setValue(data.using_builtin ? (data.builtin_prompt || '') : (data.system_prompt || ''));
      setSeeded(true);
    }
  }, [data, seeded]);

  const usingBuiltin = data && data.using_builtin;
  const builtin = (data && data.builtin_prompt) || '';
  const dirty = data && value !== (usingBuiltin ? builtin : (data.system_prompt || ''));

  const save = async () => {
    setSaving(true);
    try {
      const res = await fetch('/api/settings', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ system_prompt: value }),
      });
      const d = await res.json();
      if (d.ok) {
        pushToast(d.using_builtin ? 'Reset to the built-in prompt' : 'System prompt saved', 'success');
        if (d.note) pushToast(d.note, 'info');
        setSeeded(false);
        onRefresh();
      } else {
        pushToast(d.error || 'Save failed', 'error');
      }
    } catch (e) {
      pushToast('Request failed: ' + e.message, 'error');
    } finally { setSaving(false); }
  };

  const resetToBuiltin = () => { setValue(builtin); };

  if (loading && !data) {
    return <div className="flex items-center justify-center h-full text-gray-500">Loading system prompt…</div>;
  }
  if (error && !data) {
    return (
      <div className="flex items-center justify-center h-full p-8">
        <div className="max-w-lg text-center text-sm text-amber-200 bg-amber-500/10 border border-amber-500/20 rounded-2xl p-6">{error}</div>
      </div>
    );
  }

  const chars = value.length;
  const words = value.trim() ? value.trim().split(/\s+/).length : 0;

  return (
    <div className="flex flex-col h-full overflow-hidden">
      <div className="flex flex-wrap items-center gap-3 px-4 md:px-6 py-4 border-b border-line bg-surface">
        <div>
          <h2 className="text-sm font-semibold text-gray-200 flex items-center gap-2">
            System Prompt
            {usingBuiltin
              ? <span className="px-1.5 py-0.5 rounded bg-white/10 text-gray-400 text-[10px] border border-white/10">built-in</span>
              : <span className="px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-300 text-[10px] border border-indigo-500/30">custom</span>}
          </h2>
          <p className="text-[11px] text-gray-500 mt-0.5">
            Replaces koda's base instructions. Mode notes, workspace, tools and skills are still layered on.
          </p>
        </div>
        <div className="ml-auto flex items-center gap-2">
          <span className="text-[10px] text-gray-600 tabular-nums">{words} words · {chars} chars</span>
          <button type="button" onClick={resetToBuiltin} disabled={value === builtin}
            className="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-white/5 border border-white/10 text-gray-400 hover:bg-white/10 disabled:opacity-40 disabled:cursor-not-allowed">
            Load built-in
          </button>
          <button type="button" onClick={save} disabled={saving || !dirty}
            className="primary-button px-3 py-1.5 text-xs font-semibold disabled:opacity-50 disabled:cursor-not-allowed">
            {saving ? 'Saving…' : 'Save prompt'}
          </button>
        </div>
      </div>

      <div className="flex-1 overflow-hidden bg-canvas p-4 md:p-6">
        <textarea value={value} onChange={e => setValue(e.target.value)}
          spellCheck={false} aria-label="System prompt"
          placeholder="Type a custom system prompt, or load the built-in and tweak it…"
          className="form-input w-full h-full font-mono text-[12px] leading-relaxed resize-none" />
      </div>

      {data && data.config_path && (
        <div className="px-4 md:px-6 py-2.5 border-t border-line bg-surface text-[10px] text-subtle truncate" title={data.config_path}>
          📄 saved to {data.config_path} · a running koda applies changes on next start
        </div>
      )}
    </div>
  );
}
// App.jsx — workspace shell, data polling, toasts, and section routing
async function fetchJson(path) {
  const res = await fetch(path);
  if (res.status === 404) {
    throw new Error(`${path} is missing — your running koda is older than this UI. Rebuild and restart koda (cargo build --release) to enable this tab.`);
  }
  if (!res.ok) throw new Error(`${path} returned ${res.status}`);
  return res.json();
}

  {
    id: 'graph', label: 'Code Graph', short: 'Graph', key: '3',
    description: 'Explore indexed symbols, definitions, references, and file relationships.',
    icon: 'M8 6a2 2 0 11-4 0 2 2 0 014 0zm12 0a2 2 0 11-4 0 2 2 0 014 0zM14 18a2 2 0 11-4 0 2 2 0 014 0zM7.7 7.2l3.1 8.1m5.5-8.1l-3.1 8.1M8 6h8',
  },
  {
    id: 'skills', label: 'Agents & Skills', short: 'Skills', key: '4',
    description: 'Manage reusable project knowledge and specialized delegation roles.',
    icon: 'M12 3l2.1 4.26L19 8l-3.5 3.4.83 4.8L12 14l-4.33 2.2.83-4.8L5 8l4.9-.74L12 3z',
  },
  {
    id: 'system', label: 'System Prompt', short: 'Prompt', key: '5',
    description: 'Review and tune the operating instructions applied to every koda session.',
    icon: 'M9 5h6M9 9h6m-6 4h4m5 8H6a2 2 0 01-2-2V3h16v16a2 2 0 01-2 2z',
  },
];

function App() {
  const [tab, setTab] = React.useState('logs');
  const [logs, setLogs] = React.useState([]);
  const [version, setVersion] = React.useState(0);
  const [connected, setConnected] = React.useState(false);
  const [toasts, setToasts] = React.useState([]);

  const [debug, setDebug] = React.useState(null);
  const [debugLoading, setDebugLoading] = React.useState(false);
  const [debugError, setDebugError] = React.useState(null);
  const [graph, setGraph] = React.useState(null);
  const [graphLoading, setGraphLoading] = React.useState(false);
  const [graphError, setGraphError] = React.useState(null);
  const [skills, setSkills] = React.useState(null);
  const [skillsLoading, setSkillsLoading] = React.useState(false);
  const [skillsError, setSkillsError] = React.useState(null);
  const [settings, setSettings] = React.useState(null);
  const [settingsLoading, setSettingsLoading] = React.useState(false);
  const [settingsError, setSettingsError] = React.useState(null);

  const seenSeqRef = React.useRef(-1);
  const logsRef = React.useRef([]);

  const pushToast = React.useCallback((message, kind = 'info') => {
    const id = Math.random().toString(36).slice(2);
    setToasts(items => [...items, { id, message, kind }]);
    setTimeout(() => setToasts(items => items.filter(item => item.id !== id)), 4000);
  }, []);

  const mergeLogs = React.useCallback((data) => {
    if (!data) return;
    if (typeof data.version === 'number') setVersion(data.version);
    const entries = data.entries || [];
    if (entries.length === 0) return;
    let maxSeq = seenSeqRef.current;
    const fresh = [];
    for (const entry of entries) {
      if (entry.seq > seenSeqRef.current) {
        fresh.push(entry);
        if (entry.seq > maxSeq) maxSeq = entry.seq;
      }
    }
    if (fresh.length > 0) {
      seenSeqRef.current = maxSeq;
      logsRef.current = [...logsRef.current, ...fresh].slice(-5000);
      setLogs(logsRef.current.slice());
    }
  }, []);

  React.useEffect(() => {
    let alive = true;
    const poll = async () => {
      try {
        const res = await fetch(`/api/logs?since=${seenSeqRef.current + 1}`);
        if (!res.ok) throw new Error(`bad status ${res.status}`);
        const data = await res.json();
        if (!alive) return;
        setConnected(true);
        mergeLogs(data);
      } catch (_) {
        if (alive) setConnected(false);
      }
    };
    poll();
    const timer = setInterval(poll, 1000);
    return () => { alive = false; clearInterval(timer); };
  }, [mergeLogs]);

  React.useEffect(() => {
    let source;
    try {
      source = new EventSource('/api/events');
      source.addEventListener('logs', event => {
        try { setConnected(true); mergeLogs(JSON.parse(event.data)); } catch (_) {}
      });
      source.onerror = () => {};
    } catch (_) {}
    return () => { if (source) source.close(); };
  }, [mergeLogs]);

  const loadDebug = React.useCallback(async () => {
    setDebugLoading(true); setDebugError(null);
    try { setDebug(await fetchJson('/api/debug')); }
    catch (error) { setDebugError(error.message); }
    finally { setDebugLoading(false); }
  }, []);
  const loadGraph = React.useCallback(async () => {
    setGraphLoading(true); setGraphError(null);
    try { setGraph(await fetchJson('/api/codegraph')); }
    catch (error) { setGraphError(error.message); }
    finally { setGraphLoading(false); }
  }, []);
  const loadSkills = React.useCallback(async () => {
    setSkillsLoading(true); setSkillsError(null);
    try { setSkills(await fetchJson('/api/skills')); }
    catch (error) { setSkillsError(error.message); }
    finally { setSkillsLoading(false); }
  }, []);
  const loadSettings = React.useCallback(async () => {
    setSettingsLoading(true); setSettingsError(null);
    try { setSettings(await fetchJson('/api/settings')); }
    catch (error) { setSettingsError(error.message); }
    finally { setSettingsLoading(false); }
  }, []);

  React.useEffect(() => {
    if (tab === 'debug' && !debug) loadDebug();
    if (tab === 'graph' && !graph) loadGraph();
    if (tab === 'skills' && !skills) loadSkills();
    if (tab === 'system' && !settings) loadSettings();
  }, [tab, debug, graph, skills, settings, loadDebug, loadGraph, loadSkills, loadSettings]);

  const refreshDebugQuiet = React.useCallback(async () => {
    try {
      const res = await fetch('/api/debug');
      if (res.ok) setDebug(await res.json());
    } catch (_) {}
  }, []);
  React.useEffect(() => {
    if (tab !== 'debug') return;
    const timer = setInterval(refreshDebugQuiet, 1000);
    return () => clearInterval(timer);
  }, [tab, refreshDebugQuiet]);

  React.useEffect(() => {
    const handler = event => {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(event.target.tagName)) return;
      const target = WORKSPACE_TABS.find(item => item.key === event.key);
      if (target) setTab(target.id);
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  const active = WORKSPACE_TABS.find(item => item.id === tab) || WORKSPACE_TABS[0];
  const refreshCurrent = () => {
    if (tab === 'debug') loadDebug();
    if (tab === 'graph') loadGraph();
    if (tab === 'skills') loadSkills();
    if (tab === 'system') loadSettings();
  };

  return (
    <div className="flex h-screen overflow-hidden bg-canvas text-ink">
      <aside className="app-sidebar fixed z-40 bottom-0 inset-x-0 h-16 border-t md:static md:w-[236px] md:h-full md:border-t-0 md:border-r flex md:flex-col shrink-0">
        <div className="hidden md:flex items-center gap-3 h-[76px] px-4 border-b border-line">
          <div className="w-9 h-9 rounded-[10px] bg-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-950/30">
            <span className="text-white font-semibold text-[15px] tracking-tight">K</span>
          </div>
          <div className="min-w-0">
            <div className="text-[14px] font-semibold tracking-tight text-zinc-100">koda</div>
            <div className="text-[11px] text-subtle">observability workspace</div>
          </div>
        </div>

        <nav className="flex flex-1 md:flex-none md:block items-stretch justify-around md:px-2.5 md:py-3 md:space-y-1" role="tablist" aria-label="Workspace sections">
          {WORKSPACE_TABS.map(item => (
            <button key={item.id} id={`tab-${item.id}`} type="button"
              role="tab" aria-selected={tab === item.id} aria-controls="workspace-panel"
              aria-label={item.label} data-active={tab === item.id}
              onClick={() => setTab(item.id)}
              className="nav-item group relative flex flex-col md:flex-row items-center justify-center md:justify-start gap-1 md:gap-2.5 flex-1 md:w-full md:h-10 px-1 md:px-2.5 rounded-none md:rounded-lg text-[10px] md:text-[13px] font-medium transition-colors">
              <svg className="w-[18px] h-[18px] shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.7} d={item.icon} />
              </svg>
              <span className="md:hidden">{item.short}</span>
              <span className="hidden md:inline truncate">{item.label}</span>
              <kbd className="nav-key hidden md:inline-flex ml-auto min-w-[21px] h-5 px-1 items-center justify-center rounded text-[10px] font-mono">{item.key}</kbd>
            </button>
          ))}
        </nav>

        <div className="hidden md:block mt-auto p-3">
          <div className="rounded-xl border border-line bg-surface p-3">
            <div className="flex items-center justify-between gap-3">
              <div className="flex items-center gap-2 min-w-0">
                <span className={`w-2 h-2 shrink-0 rounded-full ${connected ? 'bg-emerald-400 status-dot' : 'bg-rose-400'}`} />
                <span className="text-[12px] font-medium text-zinc-300">{connected ? 'Runtime live' : 'Reconnecting'}</span>
              </div>
              <span className="text-[10px] text-subtle font-mono tabular-nums">v{version}</span>
            </div>
            <div className="mt-2 text-[11px] leading-4 text-subtle">
              {connected ? `${logs.length} events in this view` : 'Waiting for the local koda server'}
            </div>
          </div>
        </div>
      </aside>

      <section className="min-w-0 flex-1 flex flex-col pb-16 md:pb-0">
        <header className="topbar shrink-0 min-h-[76px] border-b px-4 md:px-6 flex items-center gap-4">
          <div className="md:hidden w-8 h-8 rounded-lg bg-indigo-500 flex items-center justify-center text-white text-sm font-semibold">K</div>
          <div className="min-w-0">
            <div className="flex items-center gap-2">
              <div className="text-[15px] md:text-[16px] leading-5 font-semibold tracking-tight text-zinc-100 truncate">{active.label}</div>
              {tab === 'logs' && (
                <span className="hidden sm:inline-flex items-center gap-1.5 rounded-full border border-emerald-500/20 bg-emerald-500/[0.08] px-2 py-0.5 text-[10px] font-medium text-emerald-300">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400" />live tail
                </span>
              )}
            </div>
            <p className="hidden sm:block mt-0.5 max-w-2xl text-[12px] leading-4 text-subtle truncate">{active.description}</p>
          </div>

          <div className="ml-auto flex items-center gap-2">
            <div className="md:hidden flex items-center gap-1.5 px-2 text-[11px] text-muted">
              <span className={`w-2 h-2 rounded-full ${connected ? 'bg-emerald-400' : 'bg-rose-400'}`} />
              <span className="hidden sm:inline">{connected ? 'Live' : 'Offline'}</span>
            </div>
            {tab !== 'logs' && (
              <button type="button" onClick={refreshCurrent}
                className="control inline-flex items-center gap-2 px-3 text-[12px] font-medium"
                aria-label="Refresh data" title="Refresh this view">
                <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M20 11a8.1 8.1 0 00-15.5-2M4 4v5h5m-5 4a8.1 8.1 0 0015.5 2M20 20v-5h-5" />
                </svg>
                <span className="hidden sm:inline">Refresh</span>
              </button>
            )}
          </div>
        </header>

        <main id="workspace-panel" className="relative flex-1 min-h-0 overflow-hidden" role="tabpanel" aria-labelledby={`tab-${tab}`}>
          <div className={tab === 'logs' ? 'h-full' : 'hidden'}>
            <LiveLogs logs={logs} version={version} connected={connected} />
          </div>
          {tab === 'debug' && <LlmDebug debug={debug} loading={debugLoading} error={debugError} />}
          {tab === 'graph' && <CodeGraph graph={graph} loading={graphLoading} error={graphError} />}
          {tab === 'skills' && <AgentsSkills skills={skills} loading={skillsLoading} error={skillsError} onRefresh={loadSkills} pushToast={pushToast} />}
          {tab === 'system' && <SystemPrompt data={settings} loading={settingsLoading} error={settingsError} onRefresh={loadSettings} pushToast={pushToast} />}
        </main>
      </section>

      <div className="fixed z-50 bottom-20 md:bottom-5 right-4 md:right-5 flex flex-col gap-2 items-end pointer-events-none" aria-live="polite">
        {toasts.map(toast => (
          <div key={toast.id} role={toast.kind === 'error' ? 'alert' : 'status'}
            className={`pointer-events-auto max-w-sm px-3.5 py-2.5 rounded-lg shadow-popover border text-[12px] font-medium animate-toast-in ${
              toast.kind === 'success' ? 'bg-[#102019] border-emerald-500/30 text-emerald-200' :
              toast.kind === 'error' ? 'bg-[#241216] border-rose-500/30 text-rose-200' :
              'bg-overlay border-line-strong text-zinc-200'
            }`}>
            {toast.message}
          </div>
        ))}
      </div>
    </div>
  );
}

    // ---- Mount ----
    const rootEl = document.getElementById('root');
    try {
      const root = ReactDOM.createRoot(rootEl);
      root.render(<App />);
    } catch (err) {
      rootEl.innerHTML = '<div id="boot-error" style="padding:20px;color:#f87171">Failed to start UI: ' + (err && err.message) + '</div>';
      console.error(err);
    }
  </script>
</body>
</html>
