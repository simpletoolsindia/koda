    body {

        radial-gradient(1200px 600px at 15% -10%, rgba(56,189,248,0.10), transparent 55%),

       A plain (non-module) babel script uses the classic JSX runtime

  <!-- Application source (JSX, transformed in-browser by Babel Standalone). -->
  <script type="text/babel" data-presets="react-classic">
// LiveLogs.jsx — Live tailing log viewer with filters, search, and auto-scroll
function LiveLogs({ logs, version, connected }) {
  const [levelFilter, setLevelFilter] = React.useState({ debug: false, info: true, warn: true, error: true });
  const [areaFilter, setAreaFilter] = React.useState('all');
  const [search, setSearch] = React.useState('');
  const [detailLevel, setDetailLevel] = React.useState('simple'); // simple | medium | high
  const [autoScroll, setAutoScroll] = React.useState(true);
  const [expandedSeq, setExpandedSeq] = React.useState(null);
  const containerRef = React.useRef(null);
  const bottomRef = React.useRef(null);

  const areas = React.useMemo(() => {
    const s = new Set();
    logs.forEach(l => s.add(l.area));
    return ['all', ...Array.from(s).sort()];
  }, [logs]);

  const filtered = React.useMemo(() => {
    return logs.filter(entry => {
      if (!levelFilter[entry.level]) return false;
      if (areaFilter !== 'all' && entry.area !== areaFilter) return false;
      if (detailLevel === 'simple' && (entry.level === 'debug')) return false;
      if (detailLevel === 'medium' && entry.level === 'debug' && entry.area !== 'tool') return false;
      if (search && !entry.message.toLowerCase().includes(search.toLowerCase()) &&
          !(entry.fields || []).some(([k,v]) => `${k}${v}`.toLowerCase().includes(search.toLowerCase()))) return false;
      return true;
    });
  }, [logs, levelFilter, areaFilter, search, detailLevel]);

  // Cap DOM nodes — show last 500
  const MAX_VISIBLE = 500;
  const visible = filtered.length > MAX_VISIBLE ? filtered.slice(-MAX_VISIBLE) : filtered;
  const trimmed = filtered.length - visible.length;

  React.useEffect(() => {
    if (autoScroll && bottomRef.current) {
      bottomRef.current.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }
  }, [visible, autoScroll]);

  const handleScroll = () => {
    if (!containerRef.current) return;
    const { scrollTop, scrollHeight, clientHeight } = containerRef.current;
    const atBottom = scrollHeight - scrollTop - clientHeight < 60;
    if (!atBottom && autoScroll) setAutoScroll(false);
  };

  const levelColors = {
    debug: 'text-gray-500',
    info: 'text-cyan-400',
    warn: 'text-amber-400',
    error: 'text-red-400',
  };
  const levelBg = {
    debug: 'bg-gray-500/10 border-gray-600/30',
    info: 'bg-cyan-500/10 border-cyan-500/30',
    warn: 'bg-amber-500/10 border-amber-500/30',
    error: 'bg-red-500/10 border-red-500/30',
  };

  const formatTime = (at) => {
    const d = new Date(at * 1000);
    return d.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' }) +
      '.' + String(d.getMilliseconds()).padStart(3, '0');
  };

  return (
    <div className="flex flex-col h-full">
      {/* Filter bar */}
      <div className="flex flex-wrap items-center gap-2 p-3 border-b border-white/5 bg-white/[0.02] backdrop-blur-sm">
        {/* Level toggles */}
        <div className="flex gap-1" role="group" aria-label="Log level filters">
          {['debug','info','warn','error'].map(lv => (
            <button key={lv} onClick={() => setLevelFilter(f => ({...f, [lv]: !f[lv]}))}
              className={`px-2.5 py-1 rounded-md text-xs font-mono font-semibold uppercase tracking-wide transition-all duration-200 border ${
                levelFilter[lv] ? levelBg[lv] + ' ' + levelColors[lv] : 'bg-transparent border-white/5 text-gray-600'
              } hover:scale-105 active:scale-95`}
              aria-pressed={levelFilter[lv]} aria-label={`Filter ${lv} logs`}>
              {lv}
            </button>
          ))}
        </div>
        <div className="w-px h-5 bg-white/10 mx-1" />
        {/* Area select */}
        <select value={areaFilter} onChange={e => setAreaFilter(e.target.value)}
          className="bg-white/5 border border-white/10 rounded-lg px-2 py-1 text-xs text-gray-300 focus:outline-none focus:ring-1 focus:ring-cyan-500/50"
          aria-label="Filter by area">
          {areas.map(a => <option key={a} value={a}>{a}</option>)}
        </select>
        {/* Detail level */}
        <select value={detailLevel} onChange={e => setDetailLevel(e.target.value)}
          className="bg-white/5 border border-white/10 rounded-lg px-2 py-1 text-xs text-gray-300 focus:outline-none focus:ring-1 focus:ring-cyan-500/50"
          aria-label="Detail level">
          <option value="simple">Simple (info+)</option>
          <option value="medium">Medium (+tool)</option>
          <option value="high">High (all)</option>
        </select>
        {/* Search */}
        <div className="relative flex-1 min-w-[140px] max-w-xs">
          <svg className="absolute left-2 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
          <input type="text" value={search} onChange={e => setSearch(e.target.value)}
            placeholder="Search logs…" aria-label="Search logs"
            className="w-full bg-white/5 border border-white/10 rounded-lg pl-7 pr-2 py-1 text-xs text-gray-200 placeholder-gray-600 focus:outline-none focus:ring-1 focus:ring-cyan-500/50" />
        </div>
        {/* Auto-scroll toggle */}
        <button onClick={() => { setAutoScroll(!autoScroll); if (!autoScroll && bottomRef.current) bottomRef.current.scrollIntoView({ behavior: 'smooth' }); }}
          className={`flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-medium transition-all border ${
            autoScroll ? 'bg-cyan-500/15 border-cyan-500/30 text-cyan-400' : 'bg-white/5 border-white/10 text-gray-500'
          } hover:scale-105 active:scale-95`}
          aria-label={autoScroll ? 'Pause auto-scroll' : 'Resume auto-scroll'}>
          {autoScroll ? (
            <svg className="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z"/></svg>
          ) : (
            <svg className="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zm-1.5-4.5l5-3.5-5-3.5v7z"/></svg>
          )}
          {autoScroll ? 'Tailing' : 'Paused'}
        </button>
        <span className="text-[10px] text-gray-600 tabular-nums">{filtered.length} entries</span>
        {/* Export filtered logs as JSON */}
        <button onClick={() => {
            const data = filtered.map(e => ({ seq: e.seq, at: e.at, level: e.level, area: e.area, message: e.message, fields: e.fields || [] }));
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const stamp = new Date().toISOString().replace(/[:.]/g, '-');
            a.href = url; a.download = `koda-logs-${stamp}.json`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
          }}
          disabled={filtered.length === 0}
          className="flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-medium transition-all border bg-white/5 border-white/10 text-gray-400 hover:text-gray-200 hover:bg-white/10 disabled:opacity-40 disabled:cursor-not-allowed hover:scale-105 active:scale-95"
          aria-label="Export filtered logs as JSON" title="Download the filtered logs as JSON">
          <svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
          Export
        </button>
      </div>

      {/* Log entries */}
      <div ref={containerRef} onScroll={handleScroll}
        className="flex-1 overflow-y-auto overflow-x-hidden font-mono text-[12px] leading-5 scroll-smooth"
        role="log" aria-live="polite" aria-label="Live log output">
        {trimmed > 0 && (
          <div className="text-center text-gray-600 text-[10px] py-1 border-b border-white/5">
            … {trimmed} older entries hidden …
          </div>
        )}
        {visible.map((entry, i) => (
          <div key={entry.seq}
            className={`group flex items-start gap-2 px-3 py-0.5 border-b border-white/[0.03] hover:bg-white/[0.03] transition-colors duration-150 animate-fade-in cursor-pointer ${
              entry.level === 'error' ? 'bg-red-500/[0.04]' : entry.level === 'warn' ? 'bg-amber-500/[0.02]' : ''
            }`}
            onClick={() => setExpandedSeq(expandedSeq === entry.seq ? null : entry.seq)}
            role="button" tabIndex={0} aria-expanded={expandedSeq === entry.seq}
            onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setExpandedSeq(expandedSeq === entry.seq ? null : entry.seq); } }}>
            <span className="text-gray-600 select-none shrink-0 w-[70px]">{formatTime(entry.at)}</span>
            <span className={`shrink-0 w-[42px] font-bold uppercase text-[10px] tracking-wider pt-[1px] ${levelColors[entry.level]}`}>{entry.level}</span>
            <span className="shrink-0 w-[60px] text-purple-400/70 text-[10px] pt-[1px]">{entry.area}</span>
            <span className="text-gray-300 break-all flex-1">
              {search ? highlightText(entry.message, search) : entry.message}
            </span>
            {entry.fields && entry.fields.length > 0 && expandedSeq !== entry.seq && (
              <span className="text-gray-600 text-[10px] shrink-0 opacity-0 group-hover:opacity-100 transition-opacity">
                +{entry.fields.length} fields
              </span>
            )}
          </div>
        ))}
        {visible.length > 0 && expandedSeq !== null && visible.some(e => e.seq === expandedSeq) && (() => {
          const entry = visible.find(e => e.seq === expandedSeq);
          if (!entry || !entry.fields || entry.fields.length === 0) return null;
          return (
            <div className="mx-3 mb-1 p-2 rounded-lg bg-white/[0.03] border border-white/5 text-[11px] animate-fade-in">
              {entry.fields.map(([k,v], i) => (
                <div key={i} className="flex gap-2">
                  <span className="text-purple-400 font-medium">{k}:</span>
                  <span className="text-gray-400 break-all">{v}</span>
                </div>
              ))}
            </div>
          );
        })()}
        <div ref={bottomRef} />
      </div>
    </div>
  );
}

function highlightText(text, query) {
  if (!query) return text;
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return text;
  return React.createElement(React.Fragment, null,
    text.slice(0, idx),
    React.createElement('mark', { className: 'bg-yellow-500/30 text-yellow-200 rounded px-0.5' }, text.slice(idx, idx + query.length)),
    text.slice(idx + query.length)
  );
}
// LlmDebug.jsx — LLM request/response debug viewer with SSE reconstruction
function parseSseResponse(raw) {
  // Reconstruct assistant text, reasoning, and tool calls from raw SSE data: lines
  let text = '';
  let reasoning = '';
  const toolCalls = {}; // index -> {id, name, args}
  let finishReason = null;
  let done = false; // saw the [DONE] sentinel → the turn is complete

  const lines = (raw || '').split(/\r?\n/);
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed.startsWith('data:')) continue;
    const payload = trimmed.slice(5).trim();
    if (!payload) continue;
    if (payload === '[DONE]') { done = true; continue; }
    let obj;
    try { obj = JSON.parse(payload); } catch { continue; }
    const choices = obj.choices || [];
    for (const ch of choices) {
      const delta = ch.delta || ch.message || {};
      if (delta.content) text += delta.content;
      if (delta.reasoning_content) reasoning += delta.reasoning_content;
      if (delta.reasoning) reasoning += delta.reasoning;
      if (ch.finish_reason) finishReason = ch.finish_reason;
      const tcs = delta.tool_calls || [];
      for (const tc of tcs) {
        const idx = tc.index != null ? tc.index : (tc.id || 0);
        if (!toolCalls[idx]) toolCalls[idx] = { id: tc.id || '', name: '', args: '' };
        if (tc.id) toolCalls[idx].id = tc.id;
        if (tc.function) {
          if (tc.function.name) toolCalls[idx].name += tc.function.name;
          if (tc.function.arguments) toolCalls[idx].args += tc.function.arguments;
        }
      }
    }
  }
  // "Processing" = we have a response log but it hasn't hit [DONE]/finish yet.
  const processing = (raw && raw.length > 0) ? !(done || finishReason) : false;
  return { text, reasoning, toolCalls: Object.values(toolCalls), finishReason, done, processing };
}

// Copy text to the clipboard, tolerating older browsers / http origins.
function copyToClipboard(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
  } catch (_) { /* fall through */ }
  return new Promise((resolve) => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    document.body.removeChild(ta); resolve();
  });
}

// A small copy button; shows a transient ✓ after a successful copy.
function CopyButton({ text, label = 'Copy', className = '' }) {
  const [copied, setCopied] = React.useState(false);
  if (text == null || text === '') return null;
  return (
    <button type="button"
      onClick={(e) => { e.stopPropagation(); copyToClipboard(String(text)).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1200); }); }}
      className={`inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-medium border transition-all ${copied ? 'bg-emerald-500/20 border-emerald-500/40 text-emerald-300' : 'bg-white/5 border-white/10 text-gray-400 hover:text-gray-200 hover:bg-white/10'} ${className}`}
      title="Copy to clipboard" aria-label={copied ? 'Copied' : label}>
      {copied ? (
        <><svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M5 13l4 4L19 7" /></svg>Copied</>
      ) : (
        <><svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2v-2m-6-12h6a2 2 0 012 2v6m-8-8V3m0 2h.01" /></svg>{label}</>
      )}
    </button>
  );
}

function parseRequest(raw) {
  try { return typeof raw === 'string' ? JSON.parse(raw) : raw; }
  catch { return null; }
}

function LlmDebug({ debug, loading, error }) {
  const [selectedId, setSelectedId] = React.useState(null);
  const [followLatest, setFollowLatest] = React.useState(true);

  const sessions = (debug && debug.sessions) || [];

  // Which sessions are still streaming (prompt sent, response not yet [DONE]).
  const statusById = React.useMemo(() => {
    const m = {};
    for (const s of sessions) m[s.id] = parseSseResponse(s.response);
    return m;
  }, [sessions]);

  // Follow the newest session so the prompt "currently being processed" is what
  // you see by default; stop following once the user picks a session manually.
  React.useEffect(() => {
    if (sessions.length === 0) return;
    const newest = sessions[sessions.length - 1].id;
    if (followLatest || !selectedId) setSelectedId(newest);
  }, [sessions.map(s => s.id).join(','), followLatest]);

  if (loading && !debug) {
    return <div className="flex items-center justify-center h-full text-gray-500">Loading debug sessions…</div>;
  }

  if (debug && !debug.enabled) {
    return (
      <div className="flex items-center justify-center h-full p-8">
        <div className="max-w-md text-center p-8 rounded-2xl bg-gradient-to-br from-amber-500/10 to-orange-500/5 border border-amber-500/20 backdrop-blur-sm">
          <div className="w-14 h-14 mx-auto mb-4 rounded-xl bg-amber-500/20 flex items-center justify-center">
            <svg className="w-7 h-7 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
          </div>
          <h3 className="text-lg font-semibold text-amber-200 mb-2">Debug capture is disabled</h3>
          <p className="text-sm text-gray-400 leading-relaxed">
            Turn on <code className="px-1.5 py-0.5 rounded bg-white/10 text-cyan-300 font-mono text-xs">debug</code> capture in koda — the <code className="px-1.5 py-0.5 rounded bg-white/10 text-cyan-300 font-mono text-xs">/debug</code> command, the <code className="px-1.5 py-0.5 rounded bg-white/10 text-cyan-300 font-mono text-xs">/settings</code> page, or <code className="px-1.5 py-0.5 rounded bg-white/10 text-cyan-300 font-mono text-xs">KODA_DEBUG=1</code> — to watch the exact prompt koda is processing and the model's response as it streams back.
          </p>
        </div>
      </div>
    );
  }

  const selected = sessions.find(s => s.id === selectedId);
  const anyProcessing = sessions.some(s => statusById[s.id] && statusById[s.id].processing);

  return (
    <div className="flex h-full">
      {/* Session list */}
      <aside className="w-56 shrink-0 border-r border-white/5 overflow-y-auto bg-white/[0.02]">
        <div className="p-3 sticky top-0 bg-[#0a0b12]/80 backdrop-blur-sm z-10">
          <div className="flex items-center gap-2 text-[10px] uppercase tracking-wider text-gray-500 font-semibold">
            <span>Sessions · {sessions.length}</span>
            {anyProcessing && (
              <span className="ml-auto inline-flex items-center gap-1 text-emerald-400 normal-case tracking-normal">
                <span className="relative flex h-2 w-2"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-70" /><span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-400" /></span>
                live
              </span>
            )}
          </div>
          <label className="mt-2 flex items-center gap-1.5 text-[10px] text-gray-500 normal-case tracking-normal cursor-pointer select-none">
            <input type="checkbox" checked={followLatest} onChange={e => setFollowLatest(e.target.checked)} className="accent-cyan-500" />
            Follow latest (currently processing)
          </label>
        </div>
        {debug && debug.dir && (
          <div className="px-3 pb-2 text-[10px] text-gray-600 truncate" title={debug.dir}>📁 {debug.dir}</div>
        )}
        {sessions.length === 0 && <div className="p-3 text-xs text-gray-600">No prompts captured yet. Send a message in koda and it will appear here live.</div>}
        {sessions.map(s => {
          const st = statusById[s.id] || {};
          return (
            <button key={s.id} onClick={() => { setSelectedId(s.id); setFollowLatest(false); }}
              className={`w-full text-left px-3 py-2.5 text-xs border-l-2 transition-all ${
                selectedId === s.id ? 'border-cyan-400 bg-cyan-500/10 text-cyan-200' : 'border-transparent text-gray-400 hover:bg-white/5'
              }`} aria-current={selectedId === s.id}>
              <div className="flex items-center gap-1.5">
                <span className="font-mono font-medium truncate">{s.id}</span>
                {st.processing ? (
                  <span className="ml-auto inline-flex items-center gap-1 text-[9px] text-emerald-400 shrink-0">
                    <span className="relative flex h-1.5 w-1.5"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-70" /><span className="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-400" /></span>
                    processing
                  </span>
                ) : st.finishReason ? (
                  <span className="ml-auto text-[9px] text-gray-600 shrink-0">{st.finishReason}</span>
                ) : null}
              </div>
            </button>
          );
        })}
      </aside>

      {/* Detail */}
      <div className="flex-1 overflow-y-auto p-4">
        {!selected && <div className="text-gray-500 text-sm">Select a session to inspect.</div>}
        {selected && <SessionDetail session={selected} status={statusById[selected.id]} />}
      </div>
    </div>
  );
}

function SessionDetail({ session, status }) {

// Render one message's content: strings as text, and multimodal arrays with
// image_url parts shown as thumbnails, text/doc parts shown readably — instead
// of dumping raw JSON.
function MessageContent({ m }) {
  const c = m.content;
  if (typeof c === 'string') {
    return <pre className="p-2.5 text-[11px] text-gray-300 whitespace-pre-wrap break-words max-h-64 overflow-y-auto font-mono">{c || (m.tool_calls ? JSON.stringify(m.tool_calls, null, 2) : '(empty)')}</pre>;
  }
  if (Array.isArray(c)) {
    return (
      <div className="p-2.5 space-y-2">
        {c.map((part, i) => {
          const type = part.type || (part.image_url ? 'image_url' : part.text != null ? 'text' : 'unknown');
          if (type === 'image_url') {
            const url = (part.image_url && (part.image_url.url || part.image_url)) || part.url || '';
            return (
              <div key={i} className="flex items-start gap-2">
                <span className="text-[9px] uppercase tracking-wider text-cyan-400/70 pt-1 shrink-0">image</span>
                {url ? <img src={url} alt="attached image" className="max-h-40 rounded-lg border border-white/10 object-contain bg-black/30" />
                     : <span className="text-[11px] text-gray-500">(no url)</span>}
              </div>
            );
          }
          const text = part.text != null ? part.text : (typeof part === 'string' ? part : JSON.stringify(part, null, 2));
          return (
            <div key={i} className="flex items-start gap-2">
              <span className="text-[9px] uppercase tracking-wider text-gray-500 pt-1 shrink-0">{type}</span>
              <pre className="text-[11px] text-gray-300 whitespace-pre-wrap break-words max-h-64 overflow-y-auto font-mono flex-1">{text}</pre>
            </div>
          );
        })}
      </div>
    );
  }
  return <pre className="p-2.5 text-[11px] text-gray-300 whitespace-pre-wrap break-words max-h-64 overflow-y-auto font-mono">{JSON.stringify(c ?? m, null, 2)}</pre>;
}

function Panel({ title, accent = 'cyan', children, copy }) {
  const accentColors = {
    cyan: 'border-cyan-500/20', purple: 'border-purple-500/20', green: 'border-emerald-500/20',
  };
  const dotColors = { cyan: 'bg-cyan-400', purple: 'bg-purple-400', green: 'bg-emerald-400' };
  return (
    <section className={`rounded-xl bg-white/[0.03] border ${accentColors[accent]} backdrop-blur-sm overflow-hidden`}>
      <h3 className="px-3 py-2 text-xs font-semibold text-gray-300 border-b border-white/5 flex items-center gap-2">
        <span className={`w-1.5 h-1.5 rounded-full ${dotColors[accent]}`} />{title}
        {copy != null && copy !== '' && <span className="ml-auto"><CopyButton text={copy} label="" /></span>}
      </h3>
      <div className="p-3">{children}</div>
    </section>
  );
}

function roleColor(role) {
  return { system: '#a78bfa', user: '#22d3ee', assistant: '#34d399', tool: '#fbbf24' }[role] || '#9ca3af';
}
// Flatten a message to plain text for the clipboard (images become a marker).
function msgPlainText(m) {
  if (typeof m.content === 'string') return m.content;
  if (Array.isArray(m.content)) {
    return m.content.map(c => {
      if (c.type === 'image_url' || c.image_url) return '[image]';
      return c.text != null ? c.text : (typeof c === 'string' ? c : JSON.stringify(c));
    }).join('\n');
  }
  if (m.tool_calls) return JSON.stringify(m.tool_calls, null, 2);
  return JSON.stringify(m.content ?? m, null, 2);
}
function prettyArgs(args) {
  try { return JSON.stringify(JSON.parse(args), null, 2); } catch { return args; }
}
// CodeGraph.jsx — Interactive force-directed graph of code symbols on Canvas
function CodeGraph({ graph, loading, error }) {
  const canvasRef = React.useRef(null);
  const stateRef = React.useRef({ nodes: [], edges: [], transform: { x: 0, y: 0, k: 1 } });
  const [hovered, setHovered] = React.useState(null);
  const [focused, setFocused] = React.useState(null);
  const [search, setSearch] = React.useState('');
  const rafRef = React.useRef(null);
  const dragRef = React.useRef(null);
  const reducedMotion = React.useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  const kindColors = {
    fn: '#22d3ee', function: '#22d3ee', method: '#38bdf8',
    struct: '#a78bfa', class: '#f472b6', interface: '#c084fc',
    enum: '#fbbf24', trait: '#fb923c', type: '#facc15',
    const: '#34d399', var: '#4ade80', module: '#94a3b8',
  };
  const colorFor = (kind) => kindColors[kind] || '#9ca3af';

  // Build simulation nodes/edges from graph
  React.useEffect(() => {
    if (!graph) return;
    const canvas = canvasRef.current;
    const W = canvas ? canvas.clientWidth : 800;
    const H = canvas ? canvas.clientHeight : 600;

    const symNodes = graph.nodes.map((n, i) => ({
      id: n.id, kind: n.kind, file: n.file, line: n.line, refs: n.refs, type: 'symbol',
      x: W/2 + Math.cos(i) * (100 + Math.random()*200),
      y: H/2 + Math.sin(i) * (100 + Math.random()*200),
      vx: 0, vy: 0,
    }));

    // file nodes derived from edges
    const fileSet = new Map();
    graph.edges.forEach(e => { if (!fileSet.has(e.from)) fileSet.set(e.from, true); });
    const fileNodes = Array.from(fileSet.keys()).map((f, i) => ({
      id: f, kind: 'file', type: 'file', file: f,
      x: W/2 + Math.cos(i*2) * (150 + Math.random()*150),
      y: H/2 + Math.sin(i*2) * (150 + Math.random()*150),
      vx: 0, vy: 0,
    }));

    const nodeMap = new Map();
    [...symNodes, ...fileNodes].forEach(n => nodeMap.set(n.type + ':' + n.id, n));

    const simEdges = graph.edges.map(e => ({
      source: nodeMap.get('file:' + e.from),
      target: nodeMap.get('symbol:' + e.to),
      kind: e.kind,
    })).filter(e => e.source && e.target);

    stateRef.current.nodes = [...symNodes, ...fileNodes];
    stateRef.current.edges = simEdges;
    stateRef.current.transform = { x: 0, y: 0, k: 1 };
    setFocused(null);
    startSim();
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [graph]);

  const startSim = () => {
    let ticks = 0;
    const maxTicks = reducedMotion.current ? 1 : 300;
    const tick = () => {
      const { nodes, edges } = stateRef.current;
      const canvas = canvasRef.current;
      if (!canvas) return;
      const W = canvas.clientWidth, H = canvas.clientHeight;
      const cx = W/2, cy = H/2;

      // repulsion
      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        for (let j = i+1; j < nodes.length; j++) {
          const b = nodes[j];
          let dx = a.x - b.x, dy = a.y - b.y;
          let dist2 = dx*dx + dy*dy + 0.01;
          const force = 1400 / dist2;
          const dist = Math.sqrt(dist2);
          const fx = (dx/dist) * force, fy = (dy/dist) * force;
          a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
        }
      }
      // springs
      for (const e of edges) {
        const dx = e.target.x - e.source.x, dy = e.target.y - e.source.y;
        const dist = Math.sqrt(dx*dx + dy*dy) + 0.01;
        const target = 60;
        const force = (dist - target) * 0.02;
        const fx = (dx/dist)*force, fy = (dy/dist)*force;
        e.source.vx += fx; e.source.vy += fy;
        e.target.vx -= fx; e.target.vy -= fy;
      }
      // centering + integrate
      for (const n of nodes) {
        n.vx += (cx - n.x) * 0.002;
        n.vy += (cy - n.y) * 0.002;
        n.vx *= 0.85; n.vy *= 0.85;
        if (dragRef.current !== n) { n.x += n.vx; n.y += n.vy; }
      }
      draw();
      ticks++;
      if (ticks < maxTicks) rafRef.current = requestAnimationFrame(tick);
    };
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    tick();
  };

  const draw = () => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    if (canvas.width !== W*dpr) { canvas.width = W*dpr; canvas.height = H*dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const t = stateRef.current.transform;
    ctx.translate(t.x, t.y); ctx.scale(t.k, t.k);

    const { nodes, edges } = stateRef.current;
    const q = search.toLowerCase();
    const focusId = focused;

    // edges
    ctx.lineWidth = 0.7 / t.k;
    for (const e of edges) {
      const active = focusId && (e.source.id === focusId || e.target.id === focusId);
      ctx.strokeStyle = active ? 'rgba(34,211,238,0.5)' : 'rgba(148,163,184,0.12)';
      ctx.beginPath();
      ctx.moveTo(e.source.x, e.source.y);
      ctx.lineTo(e.target.x, e.target.y);
      ctx.stroke();
    }

    // nodes
    for (const n of nodes) {
      const isFile = n.type === 'file';
      const r = isFile ? 5 : Math.min(3 + (n.refs || 0) * 0.6, 11);
      const matched = q && n.id.toLowerCase().includes(q);
      const isFocus = focusId === n.id;
      const dim = focusId && !isFocus && !edges.some(e => (e.source.id === focusId && e.target === n) || (e.target.id === focusId && e.source === n));

      ctx.globalAlpha = dim ? 0.15 : 1;
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI*2);
      if (isFile) {
        ctx.fillStyle = '#1e293b';
        ctx.strokeStyle = 'rgba(148,163,184,0.4)';
        ctx.fill(); ctx.lineWidth = 1/t.k; ctx.stroke();
      } else {
        ctx.fillStyle = colorFor(n.kind);
        ctx.fill();
      }
      if (matched || isFocus) {
        ctx.strokeStyle = matched ? '#fde047' : '#fff';
        ctx.lineWidth = 2/t.k;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      // labels for larger/focused nodes
      if ((r > 7 || isFocus || matched || (hovered && hovered.id === n.id)) && t.k > 0.5) {
        ctx.fillStyle = 'rgba(226,232,240,0.85)';
        ctx.font = `${10/t.k}px ui-monospace, monospace`;
        const label = isFile ? n.id.split('/').pop() : n.id;
        ctx.fillText(label, n.x + r + 2, n.y + 3);
      }
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };

  React.useEffect(() => { draw(); }, [hovered, focused, search]);

  // Interaction: convert screen to graph coords
  const toGraph = (clientX, clientY) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const t = stateRef.current.transform;
    return { x: (clientX - rect.left - t.x) / t.k, y: (clientY - rect.top - t.y) / t.k };
  };
  const nodeAt = (gx, gy) => {
    const { nodes } = stateRef.current;
    for (let i = nodes.length - 1; i >= 0; i--) {
      const n = nodes[i];
      const r = (n.type === 'file' ? 5 : Math.min(3 + (n.refs||0)*0.6, 11)) + 4;
      if ((n.x-gx)**2 + (n.y-gy)**2 < r*r) return n;
    }
    return null;
  };

  const onMouseDown = (e) => {
    const g = toGraph(e.clientX, e.clientY);
    const n = nodeAt(g.x, g.y);
    if (n) { dragRef.current = n; }
    else { dragRef.current = { pan: true, sx: e.clientX, sy: e.clientY, ox: stateRef.current.transform.x, oy: stateRef.current.transform.y }; }
  };
  const onMouseMove = (e) => {
    const d = dragRef.current;
    if (d && d.pan) {
      stateRef.current.transform.x = d.ox + (e.clientX - d.sx);
      stateRef.current.transform.y = d.oy + (e.clientY - d.sy);
      draw();
      return;
    }
    if (d) {
      const g = toGraph(e.clientX, e.clientY);
      d.x = g.x; d.y = g.y; d.vx = 0; d.vy = 0;
      draw();
      return;
    }
    const g = toGraph(e.clientX, e.clientY);
    const n = nodeAt(g.x, g.y);
    setHovered(n && n.type === 'symbol' ? n : (n || null));
    canvasRef.current.style.cursor = n ? 'pointer' : 'grab';
  };
  const onMouseUp = (e) => {
    const d = dragRef.current;
    if (d && !d.pan && Math.abs(d.vx) < 0.01) {
      // treat as click-focus
    }
    if (d && !d.pan) {
      const g = toGraph(e.clientX, e.clientY);
      const n = nodeAt(g.x, g.y);
      if (n && n === d) setFocused(focused === n.id ? null : n.id);
    }
    dragRef.current = null;
  };
  const onWheel = (e) => {
    e.preventDefault();
    const t = stateRef.current.transform;
    const rect = canvasRef.current.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const scale = e.deltaY < 0 ? 1.1 : 0.9;
    const nk = Math.max(0.2, Math.min(4, t.k * scale));
    t.x = mx - (mx - t.x) * (nk / t.k);
    t.y = my - (my - t.y) * (nk / t.k);
    t.k = nk;
    draw();
  };

  if (loading && !graph) return <div className="flex items-center justify-center h-full text-gray-500">Building code graph…</div>;
  if (error && !graph) return (

                    <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>

function Field({ label, required, children }) {

// SystemPrompt.jsx — view and edit koda's system prompt from the web UI.
function SystemPrompt({ data, loading, error, onRefresh, pushToast }) {
  const [value, setValue] = React.useState('');
  const [seeded, setSeeded] = React.useState(false);
  const [saving, setSaving] = React.useState(false);

  // Seed the editor once data arrives: show the custom prompt if set, else the
  // built-in default so the user edits from something real rather than blank.
  React.useEffect(() => {
    if (data && !seeded) {
      setValue(data.using_builtin ? (data.builtin_prompt || '') : (data.system_prompt || ''));
      setSeeded(true);
    }
  }, [data, seeded]);

  const usingBuiltin = data && data.using_builtin;
  const builtin = (data && data.builtin_prompt) || '';
  const dirty = data && value !== (usingBuiltin ? builtin : (data.system_prompt || ''));

  const save = async () => {
    setSaving(true);
    try {
      const res = await fetch('/api/settings', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ system_prompt: value }),
      });
      const d = await res.json();
      if (d.ok) {
        pushToast(d.using_builtin ? 'Reset to the built-in prompt' : 'System prompt saved', 'success');
        if (d.note) pushToast(d.note, 'info');
        setSeeded(false);
        onRefresh();
      } else {
        pushToast(d.error || 'Save failed', 'error');
      }
    } catch (e) {
      pushToast('Request failed: ' + e.message, 'error');
    } finally { setSaving(false); }
  };

  const resetToBuiltin = () => { setValue(builtin); };

  if (loading && !data) {
    return <div className="flex items-center justify-center h-full text-gray-500">Loading system prompt…</div>;
  }
  if (error && !data) {
    return (
      <div className="flex items-center justify-center h-full p-8">
        <div className="max-w-lg text-center text-sm text-amber-200 bg-amber-500/10 border border-amber-500/20 rounded-2xl p-6">{error}</div>
      </div>
    );
  }

  const chars = value.length;
  const words = value.trim() ? value.trim().split(/\s+/).length : 0;

  return (
    <div className="flex flex-col h-full overflow-hidden">
      <div className="flex items-center gap-2 p-4 border-b border-white/5">
        <div>
          <h2 className="text-sm font-semibold text-gray-200 flex items-center gap-2">
            System Prompt
            {usingBuiltin
              ? <span className="px-1.5 py-0.5 rounded bg-white/10 text-gray-400 text-[10px] border border-white/10">built-in</span>
              : <span className="px-1.5 py-0.5 rounded bg-cyan-500/20 text-cyan-300 text-[10px] border border-cyan-500/30">custom</span>}
          </h2>
          <p className="text-[11px] text-gray-500 mt-0.5">
            Replaces koda's base instructions. Mode notes, workspace, tools and skills are still layered on.
          </p>
        </div>
        <div className="ml-auto flex items-center gap-2">
          <span className="text-[10px] text-gray-600 tabular-nums">{words} words · {chars} chars</span>
          <button type="button" onClick={resetToBuiltin} disabled={value === builtin}
            className="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-white/5 border border-white/10 text-gray-400 hover:bg-white/10 disabled:opacity-40 disabled:cursor-not-allowed">
            Load built-in
          </button>
          <button type="button" onClick={save} disabled={saving || !dirty}
            className="px-3 py-1.5 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-500 text-white text-xs font-semibold hover:from-cyan-400 hover:to-blue-400 transition-all disabled:opacity-50 disabled:cursor-not-allowed active:scale-[0.98] shadow-lg shadow-cyan-500/20">
            {saving ? 'Saving…' : 'Save prompt'}
          </button>
        </div>
      </div>

      <div className="flex-1 overflow-hidden p-4">
        <textarea value={value} onChange={e => setValue(e.target.value)}
          spellCheck={false} aria-label="System prompt"
          placeholder="Type a custom system prompt, or load the built-in and tweak it…"
          className="form-input w-full h-full font-mono text-[12px] leading-relaxed resize-none" />
      </div>

      {data && data.config_path && (
        <div className="px-4 py-2 border-t border-white/5 text-[10px] text-gray-600 truncate" title={data.config_path}>
          📄 saved to {data.config_path} · a running koda applies changes on next start
        </div>
      )}
    </div>
  );
}
// App.jsx — Root component: nav, data polling, toasts, section routing
// Fetch JSON from a koda API endpoint. A 404 almost always means the running
// koda binary is older than this UI and lacks the endpoint — so say exactly
// that, since "failed to load" alone sends people hunting in the wrong place.
async function fetchJson(path) {
  const res = await fetch(path);
  if (res.status === 404) {
    throw new Error(`${path} is missing — your running koda is older than this UI. Rebuild and restart koda (cargo build --release) to enable this tab.`);
  }
  if (!res.ok) throw new Error(`${path} returned ${res.status}`);
  return res.json();
}

function App() {
  const [tab, setTab] = React.useState('logs');
  const [logs, setLogs] = React.useState([]);
  const [version, setVersion] = React.useState(0);
  const [connected, setConnected] = React.useState(false);
  const [toasts, setToasts] = React.useState([]);

  const [debug, setDebug] = React.useState(null);
  const [debugLoading, setDebugLoading] = React.useState(false);
  const [debugError, setDebugError] = React.useState(null);

  const [graph, setGraph] = React.useState(null);
  const [graphLoading, setGraphLoading] = React.useState(false);
  const [graphError, setGraphError] = React.useState(null);

  const [skills, setSkills] = React.useState(null);
  const [skillsLoading, setSkillsLoading] = React.useState(false);
  const [skillsError, setSkillsError] = React.useState(null);

  const [settings, setSettings] = React.useState(null);
  const [settingsLoading, setSettingsLoading] = React.useState(false);
  const [settingsError, setSettingsError] = React.useState(null);

  const seenSeqRef = React.useRef(-1);
  const logsRef = React.useRef([]);

  const pushToast = (message, kind = 'info') => {
    const id = Math.random().toString(36).slice(2);
    setToasts(t => [...t, { id, message, kind }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 4000);
  };

  // Merge new log entries (append-only by seq)
  const mergeLogs = React.useCallback((data) => {
    if (!data) return;
    if (typeof data.version === 'number') setVersion(data.version);
    const entries = data.entries || [];
    if (entries.length === 0) return;
    let maxSeq = seenSeqRef.current;
    const fresh = [];
    for (const e of entries) {
      if (e.seq > seenSeqRef.current) { fresh.push(e); if (e.seq > maxSeq) maxSeq = e.seq; }
    }
    if (fresh.length > 0) {
      seenSeqRef.current = maxSeq;
      logsRef.current = [...logsRef.current, ...fresh];
      // hard cap in memory at 5000
      if (logsRef.current.length > 5000) logsRef.current = logsRef.current.slice(-5000);
      setLogs(logsRef.current.slice());
    }
  }, []);

  // Poll logs every ~1s
  React.useEffect(() => {
    let alive = true;
    const poll = async () => {
      try {
        const since = seenSeqRef.current + 1;
        const res = await fetch(`/api/logs?since=${since}`);
        if (!res.ok) throw new Error('bad status ' + res.status);
        const data = await res.json();
        if (!alive) return;
        setConnected(true);
        mergeLogs(data);
      } catch (e) {
        if (alive) setConnected(false);
      }
    };
    poll();
    const iv = setInterval(poll, 1000);
    return () => { alive = false; clearInterval(iv); };
  }, [mergeLogs]);

  // Optional SSE for lower-latency updates
  React.useEffect(() => {
    let es;
    try {
      es = new EventSource('/api/events');
      es.addEventListener('logs', (ev) => {
        try { const data = JSON.parse(ev.data); setConnected(true); mergeLogs(data); } catch {}
      });
      es.onerror = () => { /* fall back to polling; keep quiet */ };
    } catch {}
    return () => { if (es) es.close(); };
  }, [mergeLogs]);

  // Lazy-load section data
  const loadDebug = React.useCallback(async () => {
    setDebugLoading(true); setDebugError(null);
    try {
      setDebug(await fetchJson('/api/debug'));
    } catch (e) { setDebugError(e.message); } finally { setDebugLoading(false); }
  }, []);

  const loadGraph = React.useCallback(async () => {
    setGraphLoading(true); setGraphError(null);
    try {
      setGraph(await fetchJson('/api/codegraph'));
    } catch (e) { setGraphError(e.message); } finally { setGraphLoading(false); }
  }, []);

  const loadSkills = React.useCallback(async () => {
    setSkillsLoading(true); setSkillsError(null);
    try {
      setSkills(await fetchJson('/api/skills'));
    } catch (e) { setSkillsError(e.message); } finally { setSkillsLoading(false); }
  }, []);

  const loadSettings = React.useCallback(async () => {
    setSettingsLoading(true); setSettingsError(null);
    try {
      setSettings(await fetchJson('/api/settings'));
    } catch (e) { setSettingsError(e.message); } finally { setSettingsLoading(false); }
  }, []);

  React.useEffect(() => {
    if (tab === 'debug' && !debug) loadDebug();
    if (tab === 'graph' && !graph) loadGraph();
    if (tab === 'skills' && !skills) loadSkills();
    if (tab === 'system' && !settings) loadSettings();
  }, [tab]);

  // While the LLM Debug tab is open, poll so the prompt currently being
  // processed and the response streaming back appear live (no manual refresh).
  // Silent refresh: never flips the tab into a loading spinner.
  const refreshDebugQuiet = React.useCallback(async () => {
    try {
      const res = await fetch('/api/debug');
      if (!res.ok) return;
      setDebug(await res.json());
    } catch (_) { /* keep last snapshot on a blip */ }
  }, []);

  React.useEffect(() => {
    if (tab !== 'debug') return;
    const iv = setInterval(refreshDebugQuiet, 1000);
    return () => clearInterval(iv);
  }, [tab, refreshDebugQuiet]);

  // Keyboard shortcuts 1-4
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
      const map = { '1': 'logs', '2': 'debug', '3': 'graph', '4': 'skills', '5': 'system' };
      if (map[e.key]) setTab(map[e.key]);
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  const tabs = [
    { id: 'logs', label: 'Live Logs', icon: 'M4 6h16M4 12h16M4 18h7' },
    { id: 'debug', label: 'LLM Debug', icon: 'M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z' },
    { id: 'graph', label: 'Code Graph', icon: 'M13 10V3L4 14h7v7l9-11h-7z' },
    { id: 'skills', label: 'Agents & Skills', icon: 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z' },
    { id: 'system', label: 'System Prompt', icon: 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z' },
  ];

  return (
    <div className="flex flex-col h-screen text-gray-100">
      {/* Header / Nav */}
      <header className="shrink-0 border-b border-white/10 bg-gradient-to-r from-[#0d0e18]/90 to-[#0a0b12]/90 backdrop-blur-xl">
        <div className="flex items-center gap-4 px-4 h-14">
          {/* Logo */}
          <div className="flex items-center gap-2.5">
            <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-cyan-400 via-blue-500 to-purple-600 flex items-center justify-center shadow-lg shadow-cyan-500/30">
              <span className="text-white font-black text-sm">K</span>
            </div>
            <div>
              <div className="text-sm font-bold tracking-tight bg-gradient-to-r from-cyan-300 to-purple-300 bg-clip-text text-transparent">koda</div>
              <div className="text-[9px] text-gray-500 -mt-0.5 tracking-wider uppercase">observability</div>
            </div>
          </div>

          {/* Tabs */}
          <nav className="flex items-center gap-1 ml-2" role="tablist" aria-label="Sections">
            {tabs.map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                role="tab" aria-selected={tab === t.id}
                className={`relative flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${
                  tab === t.id ? 'text-white' : 'text-gray-500 hover:text-gray-300 hover:bg-white/5'
                }`}>
                {tab === t.id && <span className="absolute inset-0 rounded-lg bg-gradient-to-r from-cyan-500/20 to-purple-500/20 border border-cyan-500/30" />}
                <svg className="relative w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d={t.icon} /></svg>
                <span className="relative hidden sm:inline">{t.label}</span>
              </button>
            ))}
          </nav>

          {/* Status */}
          <div className="ml-auto flex items-center gap-4">
            <div className="flex items-center gap-2 text-xs">
              <span className={`relative flex h-2.5 w-2.5`}>
                {connected && <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-60" />}
                <span className={`relative inline-flex rounded-full h-2.5 w-2.5 ${connected ? 'bg-emerald-400' : 'bg-red-500'}`} />
              </span>
              <span className={connected ? 'text-emerald-400' : 'text-red-400'}>
                {connected ? 'Live' : 'Reconnecting…'}
              </span>
            </div>
            <div className="text-xs text-gray-500 tabular-nums" title="koda log version counter">
              v<span className="text-gray-300 font-medium">{version}</span>
            </div>
          </div>
        </div>
      </header>

      {/* Body */}
      <main className="flex-1 overflow-hidden relative" role="tabpanel">
        <div className={tab === 'logs' ? 'h-full' : 'hidden'}>
          <LiveLogs logs={logs} version={version} connected={connected} />
        </div>
        {tab === 'debug' && <LlmDebug debug={debug} loading={debugLoading} error={debugError} />}
        {tab === 'graph' && <CodeGraph graph={graph} loading={graphLoading} error={graphError} />}
        {tab === 'skills' && <AgentsSkills skills={skills} loading={skillsLoading} error={skillsError} onRefresh={loadSkills} pushToast={pushToast} />}
        {tab === 'system' && <SystemPrompt data={settings} loading={settingsLoading} error={settingsError} onRefresh={loadSettings} pushToast={pushToast} />}
      </main>

      {/* Refresh button for section data */}
      {tab !== 'logs' && (
        <button onClick={() => { if (tab==='debug') loadDebug(); if (tab==='graph') loadGraph(); if (tab==='skills') loadSkills(); if (tab==='system') loadSettings(); }}
          className="fixed bottom-4 right-4 z-20 w-10 h-10 rounded-full bg-white/10 backdrop-blur border border-white/10 flex items-center justify-center text-gray-300 hover:bg-white/20 hover:rotate-180 transition-all duration-500"
          aria-label="Refresh data" title="Refresh">
          <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
        </button>
      )}

      {/* Toasts */}
      <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 items-center pointer-events-none" aria-live="assertive">
        {toasts.map(t => (
          <div key={t.id}
            className={`pointer-events-auto px-4 py-2.5 rounded-xl shadow-2xl backdrop-blur-md border text-sm font-medium animate-toast-in max-w-md ${
              t.kind === 'success' ? 'bg-emerald-500/20 border-emerald-500/40 text-emerald-200' :
              t.kind === 'error' ? 'bg-red-500/20 border-red-500/40 text-red-200' :
              'bg-white/10 border-white/20 text-gray-200'
            }`} role="status">
            {t.message}
          </div>
        ))}
      </div>
    </div>
  );
}

    // ---- Mount ----
    const rootEl = document.getElementById('root');
    try {
      const root = ReactDOM.createRoot(rootEl);
      root.render(<App />);
    } catch (err) {
      rootEl.innerHTML = '<div id="boot-error" style="padding:20px;color:#f87171">Failed to start UI: ' + (err && err.message) + '</div>';
      console.error(err);
    }
  </script>
</body>
</html>
