name: Installers

# The installers are the first thing a new user runs and the only part of koda
# that `cargo test` cannot reach, so they had no coverage at all -- which is how
# a default branch that does not exist on the remote shipped, breaking every
# documented `curl | bash` with "clone failed".
#
# Fast checks run on every push. The real install runs when an installer, or
# this file, changes.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Seconds, and catches the bug that actually shipped.
  # --------------------------------------------------------------------------
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck install.sh
        run: shellcheck --severity=warning install.sh

      # The exact failure: BRANCH defaulted to a branch that is not on the
      # remote, so resolve_src's clone died and took every one-liner with it.
      - name: The branch the installers clone must exist
        run: |
          set -euo pipefail
          repo=$(sed -n 's/^REPO="\(.*\)"$/\1/p' install.sh)
          # shellcheck disable=SC2016  # ${KODA_BRANCH:-...} is sed's literal text
          sh_branch=$(sed -n 's/^BRANCH="${KODA_BRANCH:-\(.*\)}"$/\1/p' install.sh)
          ps_branch=$(sed -n 's/.*else { "\(.*\)" }).*/\1/p' install.ps1 | head -1)
          echo "install.sh  -> $sh_branch"
          echo "install.ps1 -> $ps_branch"
          test -n "$sh_branch" && test -n "$ps_branch" \
            || { echo "::error::could not read the default branch out of an installer"; exit 1; }
          test "$sh_branch" = "$ps_branch" \
            || { echo "::error::the two installers disagree on the branch"; exit 1; }
          git ls-remote --exit-code --heads "$repo" "$sh_branch" >/dev/null \
            || { echo "::error::branch '$sh_branch' does not exist in $repo"; exit 1; }

      # The other shipped bug: piped through bash, `dirname "$0"` is ".", so any
      # directory holding a Cargo.toml looked like a koda checkout and got built
      # and installed as koda.
      - name: Only koda's own source counts as koda's source
        run: |
          set -euo pipefail
          decoy=$(mktemp -d)
          printf '[package]\nname = "not-koda"\n' > "$decoy/Cargo.toml"
          # A real file, not `source <(...)`: process substitution can return
          # before bash has read it, leaving the function silently undefined.
          sed -n '/^is_koda_src()/,/^}/p' install.sh > "$decoy/fn.sh"
          # shellcheck disable=SC1090,SC1091
          source "$decoy/fn.sh"
          type is_koda_src > /dev/null \
            || { echo "::error::could not extract is_koda_src from install.sh"; exit 1; }
          if is_koda_src "$decoy"; then
            echo "::error::a non-koda crate was accepted as koda's source"; exit 1
          fi
          is_koda_src "$PWD" \
            || { echo "::error::koda's own checkout was rejected"; exit 1; }
          echo "decoy rejected, real checkout accepted"

  # --------------------------------------------------------------------------
  # Actually run it. Only when an installer changes -- it builds koda.
  # --------------------------------------------------------------------------
  install:
    name: Install on ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed
        shell: bash
        run: |
          if git diff --name-only "${{ github.event.before || 'HEAD~1' }}" HEAD 2>/dev/null \
               | grep -qE '^(install\.sh|install\.ps1|\.github/workflows/installers\.yml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changed.outputs.run == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.run == 'true'

      # PREFIX makes it non-interactive, which is also the `curl | bash` path.
      - name: Install into a scratch prefix
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          prefix="$(mktemp -d)/koda"
          PREFIX="$prefix" ./install.sh
          "$prefix/bin/koda" --version
          "$prefix/bin/koda" --help > /dev/null
          echo "installed and runs"

      # The fast path, as `curl | bash` runs it: from outside any checkout,
      # pinned to a published release so the download is what is tested.
      - name: Install a prebuilt release
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          prefix="$(mktemp -d)/koda"
          cd "$(mktemp -d)"
          KODA_VERSION=1.0.0 PREFIX="$prefix" bash < "$GITHUB_WORKSPACE/install.sh"
          "$prefix/bin/koda" --version | grep -q '1.0.0'
          echo "prebuilt installed and runs"

  # --------------------------------------------------------------------------
  # Other Linux distributions, in containers: the prebuilt binary must run on
  # more than the Ubuntu it was built on, and the installer must work with
  # each one's shell and tools.
  # --------------------------------------------------------------------------
  distros:
    name: Install on ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # `prebuilt_runs`: whether the pinned release's binary starts here.
        # 1.0.0 is built on ubuntu-22.04 (glibc 2.35), so it runs on all of
        # these. A distro it cannot run on gets `false`, and the job checks the
        # installer's fallback to a source build instead.
        include:
          - image: debian:12
            prep: apt-get update -qq && apt-get install -y -qq curl ca-certificates git build-essential >/dev/null
            prebuilt_runs: true
          - image: ubuntu:22.04
            prep: apt-get update -qq && apt-get install -y -qq curl ca-certificates git build-essential >/dev/null
            prebuilt_runs: true
          - image: fedora:41
            prep: dnf install -y -q curl git tar gzip findutils >/dev/null
            prebuilt_runs: true
          - image: archlinux:latest
            prep: pacman -Sy --noconfirm --quiet curl git tar gzip >/dev/null
            prebuilt_runs: true
    steps:
      - name: Prepare
        run: ${{ matrix.prep }}
      - uses: actions/checkout@v4
      - name: Install a prebuilt release
        if: matrix.prebuilt_runs
        shell: bash
        run: |
          set -euo pipefail
          ldd --version 2>&1 | head -1 || true
          prefix="$(mktemp -d)/koda"
          cd "$(mktemp -d)"
          KODA_VERSION=1.0.0 PREFIX="$prefix" bash < "$GITHUB_WORKSPACE/install.sh"
          "$prefix/bin/koda" --version

      # The fallback: the download is refused as unable to run, and koda is
      # built from source with the Rust the user has.
      - name: Fall back to building from source
        if: ${{ !matrix.prebuilt_runs }}
        shell: bash
        run: |
          set -euo pipefail
          ldd --version 2>&1 | head -1 || true
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal >/dev/null
          . "$HOME/.cargo/env"
          prefix="$(mktemp -d)/koda"
          cd "$(mktemp -d)"
          KODA_VERSION=1.0.0 PREFIX="$prefix" bash < "$GITHUB_WORKSPACE/install.sh" 2>&1 | tee out.txt
          grep -q "does not run here" out.txt \
            || { echo "::error::expected the prebuilt binary to be refused here"; exit 1; }
          "$prefix/bin/koda" --version

  windows:
    name: Install on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed
        shell: bash
        run: |
          if git diff --name-only "${{ github.event.before || 'HEAD~1' }}" HEAD 2>/dev/null \
               | grep -qE '^(install\.sh|install\.ps1|\.github/workflows/installers\.yml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # As `irm | iex` runs it: no $PSScriptRoot, so not the checkout.
      - name: Install a prebuilt release
        if: steps.changed.outputs.run == 'true'
        shell: pwsh
        run: |
          $env:KODA_VERSION = "1.0.0"
          $prefix = Join-Path $env:RUNNER_TEMP "koda-pre"
          Set-Location $env:RUNNER_TEMP
          $sb = [scriptblock]::Create((Get-Content -Raw "$env:GITHUB_WORKSPACE\install.ps1"))
          & $sb -Prefix $prefix
          $v = & "$prefix\bin\koda.exe" --version
          if ($v -notmatch "1\.0\.0") { throw "unexpected version: $v" }
          Write-Host "prebuilt installed and runs: $v"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changed.outputs.run == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.run == 'true'

      # From the checkout, which is built as it stands.
      - name: Install from source
        if: steps.changed.outputs.run == 'true'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP "koda-src"
          .\install.ps1 -Prefix $prefix
          & "$prefix\bin\koda.exe" --version
          & "$prefix\bin\koda.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "koda --help failed" }
          Write-Host "built, installed and runs"

  # --------------------------------------------------------------------------
  # No Windows runner is needed to catch a syntax error, and nobody here has
  # PowerShell to hand.
  # --------------------------------------------------------------------------
  powershell:
    name: install.ps1 parses
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse it
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "install.ps1 parses cleanly"
